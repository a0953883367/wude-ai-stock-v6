<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest?v=3"><link rel="apple-touch-icon" sizes="180x180" href="trend-arrow-apple-v2.png"><link rel="stylesheet" href="app_shell.css?v=1"><title>獨立估值風險雷達</title>
<style>
:root{--bg:#07111f;--card:#0d1b2d;--line:#2d496b;--text:#edf6ff;--muted:#91a4bd;--green:#5ee0af;--yellow:#f6c85f;--orange:#fb923c;--red:#fb7185;--cyan:#38bdf8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#091827);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.shell{max-width:980px;margin:auto;padding:16px 16px 100px}.hero,.panel{background:rgba(13,27,45,.97);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.eyebrow{color:var(--cyan);font-size:13px;font-weight:900}.hero h1{font-size:27px;margin:7px 0}.hero p,.note,.muted{color:var(--muted);line-height:1.65}.isolation{padding:12px;border:1px solid #31577d;background:#0a2035;border-radius:14px;color:#bae6fd;line-height:1.6}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.metric{background:#091827;border:1px solid #27415f;border-radius:15px;padding:12px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;font-size:21px;margin-top:6px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:12px 0}.toolbar input,.toolbar select{background:#091827;color:white;border:1px solid #3d5d84;border-radius:12px;padding:11px;font-size:15px}.table-wrap{overflow:auto;border:1px solid #27415f;border-radius:16px}table{width:100%;border-collapse:collapse;min-width:1050px;background:#091827;font-size:13px}th,td{padding:11px 9px;border-bottom:1px solid #203852;text-align:left;vertical-align:top}th{color:#9fdcff;position:sticky;top:0;background:#0c1d30}.pill{display:inline-block;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:800}.low{color:#bbf7d0;background:#123c2d}.medium{color:#fef3c7;background:#4b3a11}.high{color:#fed7aa;background:#4a2713}.extreme{color:#fecdd3;background:#4a1820}.missing{color:#cbd5e1;background:#293548}.right{text-align:right}.dock{position:fixed;left:16px;right:16px;bottom:14px;max-width:948px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(7,17,31,.95);border:1px solid #31577d;border-radius:20px;padding:9px;backdrop-filter:blur(16px)}.dock a{color:white;text-decoration:none;text-align:center;font-weight:850;padding:10px 4px;font-size:13px}.dock a.active{color:var(--yellow)}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.hero h1{font-size:24px}}
</style>
</head>
<body><main class="shell">
<section class="hero"><div class="eyebrow">獨立影子・先驗證再談權重</div><h1>🧮 估值風險雷達</h1><p>把現在市值換算成幾年營收、幾年獲利及幾年自由現金流，並與同產業比較，判斷目前價格包含多少未來成長期待。</p><div class="isolation">🔒 不改正式排名、不改買賣訊號、不改模型權重，也不執行交易。畫面中的「溢價估計」是同業情境估算，不是確定泡沫。</div></section>
<section class="panel"><h2>資料與驗證狀態</h2><div id="summary" class="summary"></div><p id="status" class="note">讀取獨立估值報表中…</p></section>
<section class="panel"><h2>公司估值壓力</h2><div class="toolbar"><input id="search" type="search" placeholder="輸入股票代號、公司或產業"><select id="market"><option value="ALL">台股＋美股</option><option value="TW">🇹🇼 台股</option><option value="US">🇺🇸 美股</option></select><select id="risk"><option value="ALL">全部燈號</option><option value="extreme">🔴 極高</option><option value="high">🟠 高期待</option><option value="medium">🟡 偏貴</option><option value="low">🟢 壓力低</option><option value="missing">⚪ 資料不足</option></select></div><div class="table-wrap"><table><thead><tr><th>公司</th><th>估值狀態</th><th class="right">市值</th><th class="right">幾年營收</th><th class="right">幾年獲利</th><th class="right">幾年自由現金流</th><th class="right">同業溢價估計</th><th class="right">5年隱含營收成長</th><th>資料說明</th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">ETF不套用公司營收算法，後續應使用持股加權估值、NAV折溢價、費用率及集中度。</p></section>
</main>
<script>
(function(){'use strict';var REPORT=null;function esc(v){return String(v==null?'—':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function num(v,d){var n=Number(v);return Number.isFinite(n)?n.toLocaleString('zh-TW',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}):'—'}function money(v,m){var n=Number(v);if(!Number.isFinite(n))return '—';var unit=m==='TW'?'NT$':'US$';if(Math.abs(n)>=1e12)return unit+num(n/1e12,2)+'兆';if(Math.abs(n)>=1e8)return unit+num(n/1e8,2)+'億';if(Math.abs(n)>=1e4)return unit+num(n/1e4,1)+'萬';return unit+num(n,0)}function riskClass(r){var s=Number(r.valuation_pressure_score);if(r.status!=='ready')return 'missing';if(s>=70)return 'extreme';if(s>=50)return 'high';if(s>=30)return 'medium';return 'low'}function metric(t,v){return '<div class="metric"><span>'+esc(t)+'</span><b>'+esc(v)+'</b></div>'}function renderSummary(){var c=REPORT.coverage||{},tw=c.TW||{},us=c.US||{},v=REPORT.validation||{},tv=v.TW||{},uv=v.US||{};document.getElementById('summary').innerHTML=metric('台股估值完整',num(tw.stocks_ready)+' / '+num(tw.stocks_total))+metric('美股估值完整',num(us.stocks_ready)+' / '+num(us.stocks_total))+metric('台股有效驗證',num(tv.effective_samples)+'筆／'+num(tv.effective_sessions)+'日')+metric('美股有效驗證',num(uv.effective_samples)+'筆／'+num(uv.effective_sessions)+'日');document.getElementById('status').textContent='更新：'+(REPORT.updated_at||'—')+'｜目前只收集影子樣本；至少10個交易日且100筆有效結果才審查權重。'}function renderRows(){var q=document.getElementById('search').value.trim().toLowerCase(),market=document.getElementById('market').value,risk=document.getElementById('risk').value;var rows=(REPORT.data||[]).filter(function(r){if(r.asset_type!=='STOCK')return false;if(market!=='ALL'&&r.market!==market)return false;var hay=(r.symbol+' '+r.name+' '+r.industry).toLowerCase();if(q&&hay.indexOf(q)<0)return false;return risk==='ALL'||riskClass(r)===risk}).sort(function(a,b){var av=Number(a.valuation_pressure_score),bv=Number(b.valuation_pressure_score);if(!Number.isFinite(av))av=-1;if(!Number.isFinite(bv))bv=-1;return bv-av}).slice(0,400);document.getElementById('rows').innerHTML=rows.map(function(r){var cls=riskClass(r),ex=r.estimated_excess_pct_of_market_cap,cagr=r.implied_revenue_cagr_to_peer_multiple_5y_pct;return '<tr><td><b>'+esc(r.name)+'</b><br><span class="muted">'+esc(r.symbol)+'｜'+esc(r.industry)+'</span></td><td><span class="pill '+cls+'">'+esc(r.valuation_pressure_label)+'</span><br><span class="muted">'+(r.valuation_pressure_score==null?'—':num(r.valuation_pressure_score,1)+'分')+'</span></td><td class="right">'+money(r.market_cap,r.market)+'</td><td class="right">'+(r.sales_years==null?'—':num(r.sales_years,1)+'年')+'</td><td class="right">'+(r.earnings_years==null?'—':num(r.earnings_years,1)+'年')+'</td><td class="right">'+(r.free_cash_flow_years==null?'—':num(r.free_cash_flow_years,1)+'年')+'</td><td class="right">'+(ex==null?'—':num(ex,1)+'%')+'</td><td class="right">'+(cagr==null?'—':num(cagr,1)+'%/年')+'</td><td>'+esc(r.reason)+'<br><span class="muted">核心資料 '+num(r.core_data_available)+'/4</span></td></tr>'}).join('')||'<tr><td colspan="9">沒有符合條件的公司</td></tr>'}['search','market','risk'].forEach(function(id){document.getElementById(id).addEventListener(id==='search'?'input':'change',renderRows)});fetch('reports/valuation_risk_shadow.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){REPORT=data;renderSummary();renderRows()}).catch(function(err){document.getElementById('status').textContent='估值影子尚未產生：'+err.message})})();
</script><script src="app_shell.js?v=1"></script></body></html>
