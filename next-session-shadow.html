<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.webmanifest?v=3"><link rel="apple-touch-icon" sizes="180x180" href="trend-arrow-apple-v2.png"><link rel="stylesheet" href="app_shell.css?v=1"><title>下一交易日預判・隔離影子</title>
<style>
:root{--bg:#07111f;--card:#0d1b2d;--line:#2d496b;--text:#edf6ff;--muted:#91a4bd;--green:#5ee0af;--yellow:#f6c85f;--red:#fb7185;--cyan:#38bdf8;--violet:#a78bfa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#091827);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.shell{max-width:920px;margin:auto;padding:16px 16px 105px}.hero,.panel{background:rgba(13,27,45,.97);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.eyebrow{color:var(--cyan);font-size:13px;font-weight:900}.hero h1{font-size:27px;margin:7px 0}.hero p,.note,.muted{color:var(--muted);line-height:1.65}.isolation{padding:12px;border:1px solid #5b4b99;background:#171533;border-radius:14px;color:#ddd6fe;line-height:1.6}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.metric,.candidate{background:#091827;border:1px solid #27415f;border-radius:16px;padding:13px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;font-size:21px;margin-top:6px}.tabs,.rank-tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button,.rank-tabs button{white-space:nowrap;border:1px solid #3d5d84;background:#13243a;color:white;border-radius:999px;padding:9px 13px;font-weight:850}.tabs button.active,.rank-tabs button.active{background:#075985;border-color:#38bdf8}.candidates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.candidate h3{margin:0 0 6px;font-size:18px}.candidate .rank{color:var(--yellow);font-weight:900}.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:10px 0}.scores div{background:#102238;border-radius:10px;padding:8px}.scores small{display:block;color:var(--muted)}.scores b{font-size:19px}.up{color:var(--green)}.down{color:var(--red)}.waiting{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:11px}.reasons{color:#b8c8db;font-size:12px;line-height:1.55}.warning{color:#fde68a}.current-rank{color:var(--muted);border-top:1px solid #203852;margin-top:12px;padding-top:10px}.back{display:inline-block;color:#bae6fd;text-decoration:none;margin-bottom:12px}@media(max-width:680px){.summary,.candidates{grid-template-columns:1fr 1fr}.candidate{grid-column:span 2}.hero h1{font-size:24px}}
</style>
</head>
<body><main class="shell">
<a class="back" href="index.html">← 回目前強勢排名</a>
<section class="hero"><div class="eyebrow">下一交易日・隔離驗證版</div><h1>🔭 明日上漲機率與可買性</h1><p>使用本次固定收盤以前的資料，分開預判下一個有效交易日；目前強勢排名只作輔助，不等於明日預測。</p><div class="isolation">🔒 不先挑今天上漲股、不讀取未來結果、不改正式V6、不改5日與60日紀錄，也不會自動下單。</div></section>
<section class="panel"><h2>驗證狀態</h2><div id="summary" class="summary"></div><p id="status" class="note">讀取下一交易日隔離報表中…</p></section>
<section class="panel"><h2>隔離預判排名</h2><div class="tabs" id="marketTabs"><button class="active" data-group="TW_STOCK">🇹🇼 台股</button><button data-group="TW_ETF">🇹🇼 ETF</button><button data-group="US_STOCK">🇺🇸 美股</button><button data-group="US_ETF">🇺🇸 ETF</button></div><div class="rank-tabs" id="rankTabs"><button class="active" data-kind="forecast">明日上漲機率</button><button data-kind="buyable">明日可買性</button></div><div id="candidates" class="candidates"></div><p class="note">「明日可買候選」仍要等下一交易日開盤後量價與支撐確認；機率是尚待20／60個有效交易日校準的研究估計。</p></section>
</main><script src="next_session_shadow.js?v=1"></script><script src="app_shell.js?v=1"></script></body></html>
