name: 良維資料靜默補跑

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-liangwei-once.yml

permissions:
  contents: write

concurrency:
  group: stock-briefing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate silent noon snapshot
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPACA_STOCK_FEED: ${{ vars.ALPACA_STOCK_FEED || 'sip' }}
          ALPACA_OPTION_FEED: ${{ vars.ALPACA_OPTION_FEED }}
        run: python briefing.py --period noon --no-telegram
      - name: Publish friend snapshot
        env:
          FRIEND_SITE_URL: ${{ secrets.FRIEND_SITE_URL }}
          FRIEND_SITE_BYPASS_TOKEN: ${{ secrets.FRIEND_SITE_BYPASS_TOKEN }}
        run: python tools/publish_friend_data.py
      - name: Publish owner snapshot
        env:
          OWNER_SITE_BYPASS_TOKEN: ${{ secrets.OWNER_SITE_BYPASS_TOKEN }}
        run: python tools/publish_owner_data.py
      - name: Commit refreshed reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "補跑良維首次正式資料"
          git push
