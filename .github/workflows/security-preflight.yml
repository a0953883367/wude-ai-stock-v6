name: API密鑰與敏感檔案安全檢查

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 檢查API密鑰與敏感檔案
        run: python tools/security_preflight.py
      - name: 檢查安全測試模式與備份能力
        run: |
          python tools/commercial_readiness_check.py
          python -m unittest tests.test_commercial_readiness_check
      - name: 驗證真實下單安全鎖（不連線券商）
        run: |
          python tools/live_trading_safety_check.py
          python -m unittest tests.test_live_trading_safety_check
      - name: 驗證紙上交易完整流程（只用假資料）
        run: |
          python tools/paper_trading_acceptance_check.py
          python -m unittest tests.test_paper_trading_acceptance_check
