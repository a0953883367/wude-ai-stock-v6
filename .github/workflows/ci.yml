name: 股票模型品質檢查

on:
  pull_request:
    branches: [main]
    paths:
      - "*.py"
      - "*.js"
      - "*.html"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "*.py"
      - "*.js"
      - "*.html"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: 執行完整測試
        run: python -m pytest -q
      - name: 檢查主要程式可編譯
        run: python -m py_compile briefing.py data_fetcher.py market_models.py strategy.py performance.py us_market_data.py live_api.py market_calendar.py capital_flow_shadow.py flow_weight_shadow.py large_buy_monitor.py large_buy_streams.py web_push.py million_simulation.py weight_experiment.py holding_simulation.py exit_horizon_experiment.py inverse_experiment.py inverse_etf_shadow.py missed_strength_validation.py market_rotation_shadow.py valuation_risk_shadow.py historical_lab.py system_guard.py
      - name: 檢查 2 萬元實測規則
        run: node tests/test_capital_test.js
      - name: 檢查 100 萬元五日網頁試走
        run: node tests/test_million_simulation_ui.js
      - name: 檢查法人權重五日比較
        run: node tests/test_weight_experiment_ui.js
      - name: 檢查中期與長期網頁試走
        run: node tests/test_holding_simulation_ui.js
      - name: 檢查獨立歷史驗證實驗室
        run: node tests/test_historical_lab_ui.js
      - name: 檢查 AI 模型訓練中心
        run: node tests/test_training_center_ui.js
      - name: 檢查空頭反向影子實驗
        run: node tests/test_inverse_experiment_ui.js
      - name: 檢查反向 ETF 獨立資料庫與影子頁
        run: node tests/test_inverse_etf_shadow_ui.js
      - name: 檢查獨立估值風險雷達
        run: node tests/test_valuation_risk_shadow_ui.js
      - name: 檢查強勢股漏選驗證
        run: node tests/test_missed_strength_validation_ui.js
      - name: 檢查自動即時判斷
        run: node tests/test_live_analysis.js
      - name: 檢查所有排名資格與 TOP 標示
        run: node tests/test_ranking.js
      - name: 檢查即時服務前端接線
        run: node tests/test_live_client.js
      - name: 檢查大量買賣與資金流網頁
        run: node tests/test_live_flow_ui.js
      - name: 檢查 AI 系統值班員前端接線
        run: node tests/test_system_guard_ui.js
