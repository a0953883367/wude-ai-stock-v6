name: 股票模型品質檢查

on:
  pull_request:
    branches: [main]
    paths:
      - "*.py"
      - "*.js"
      - "*.html"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "*.py"
      - "*.js"
      - "*.html"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: 執行完整測試
        run: python -m pytest -q
      - name: 檢查主要程式可編譯
        run: python -m py_compile briefing.py data_fetcher.py market_models.py strategy.py us_market_data.py live_api.py
      - name: 檢查 2 萬元實測規則
        run: node tests/test_capital_test.js
      - name: 檢查自動即時判斷
        run: node tests/test_live_analysis.js
      - name: 檢查所有排名資格與 TOP 標示
        run: node tests/test_ranking.js
      - name: 檢查即時服務前端接線
        run: node tests/test_live_client.js
