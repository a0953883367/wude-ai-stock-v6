name: 股票模型品質檢查

on:
  pull_request:
    branches: [main]
    paths:
      - "*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: 執行完整測試
        run: python -m pytest -q
      - name: 檢查主要程式可編譯
        run: python -m py_compile briefing.py data_fetcher.py market_models.py strategy.py
