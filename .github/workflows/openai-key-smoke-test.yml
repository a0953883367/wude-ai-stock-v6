name: OpenAI key smoke test

on:
  push:
    branches:
      - codex/openai-key-smoke-test-20260913
    paths:
      - .github/workflows/openai-key-smoke-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify secret is present and OpenAI Responses API accepts it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("OPENAI_API_KEY", "")
          if not key:
              raise SystemExit("OPENAI_API_KEY is missing")

          body = json.dumps({
              "model": os.environ["OPENAI_MODEL"],
              "input": "Reply with exactly: OK",
              "max_output_tokens": 16,
              "store": False,
          }).encode()
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=body,
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.loads(response.read())
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"OpenAI API HTTP {exc.code}: {detail[:800]}")
          if not payload.get("id"):
              raise SystemExit("OpenAI API returned no response id")
          print("OPENAI_API_KEY accepted")
          print("model=" + os.environ["OPENAI_MODEL"])
          print("response_id_present=true")
          print("formal_rankings_modified=false")
          print("orders_placed=false")
          PY
