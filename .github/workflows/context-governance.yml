name: 五層資料與輸出驗收

on:
  workflow_dispatch:
  pull_request:
    paths:
      - agent_control.py
      - agent_runtime.py
      - artifact_validation.py
      - presentation_delivery.py
      - artifact_registry.py
      - context_audit.py
      - context_governance.py
      - dynamic_capability_loader.py
      - memory_compaction.py
      - context_efficiency.py
      - presentation_pipeline.mjs
      - agent_workspaces/context_catalog.json
      - agent_workspaces/capability_catalog.json
      - agent_workspaces/PPT自動產生規格範本.json
      - agent_workspaces/PPT自動流程使用說明.md
      - agent_workspaces/輸出驗收規格範本.json
      - agent_workspaces/PPT交付驗收規格範本.json
      - tests/test_agent_control.py
      - tests/test_agent_runtime.py
      - tests/test_artifact_validation.py
      - tests/test_presentation_delivery.py
      - tests/test_artifact_registry.py
      - tests/test_agent_control_ui.js
      - agent-control.html
      - agent_control.js
      - agent_control.css
      - reports/artifact_registry.json
      - reports/agent_runtime.json
      - reports/context_efficiency.json
      - tests/test_context_audit.py
      - tests/test_context_governance.py
      - tests/test_dynamic_capability_loader.py
      - tests/test_memory_compaction.py
      - tests/test_context_efficiency.py
      - tests/test_presentation_pipeline.js
      - .github/workflows/context-governance.yml
  push:
    branches: [main]
    paths:
      - agent_control.py
      - agent_runtime.py
      - artifact_validation.py
      - presentation_delivery.py
      - artifact_registry.py
      - context_audit.py
      - context_governance.py
      - dynamic_capability_loader.py
      - memory_compaction.py
      - context_efficiency.py
      - presentation_pipeline.mjs
      - agent_workspaces/context_catalog.json
      - agent_workspaces/capability_catalog.json
      - agent_workspaces/PPT自動產生規格範本.json
      - agent_workspaces/PPT自動流程使用說明.md
      - agent_workspaces/輸出驗收規格範本.json
      - agent_workspaces/PPT交付驗收規格範本.json
      - tests/test_agent_control.py
      - tests/test_agent_runtime.py
      - tests/test_artifact_validation.py
      - tests/test_presentation_delivery.py
      - tests/test_artifact_registry.py
      - tests/test_agent_control_ui.js
      - agent-control.html
      - agent_control.js
      - agent_control.css
      - reports/artifact_registry.json
      - reports/agent_runtime.json
      - reports/context_efficiency.json
      - tests/test_context_audit.py
      - tests/test_context_governance.py
      - tests/test_dynamic_capability_loader.py
      - tests/test_memory_compaction.py
      - tests/test_context_efficiency.py
      - tests/test_presentation_pipeline.js
      - .github/workflows/context-governance.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安裝測試工具
        run: python -m pip install "pytest>=8,<10"
      - name: 驗證五層清冊及輸出契約
        run: >-
          python -m pytest -q
          tests/test_agent_control.py
          tests/test_agent_runtime.py
          tests/test_context_governance.py
          tests/test_context_audit.py
          tests/test_artifact_validation.py
          tests/test_presentation_delivery.py
          tests/test_artifact_registry.py
          tests/test_dynamic_capability_loader.py
          tests/test_memory_compaction.py
          tests/test_context_efficiency.py
      - name: 驗證中央 AI 交付清冊介面
        run: node tests/test_agent_control_ui.js && node tests/test_presentation_pipeline.js
      - name: 產生並核對資料治理稽核
        run: |
          python context_audit.py --output /tmp/context_governance.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/context_governance.json').read_text())
          assert report['status'] == 'passed', report
          assert report['cross_domain_conflicts'] == [], report
          assert report['cross_layer_conflicts'] == [], report
          PY
