name: AI 系統值班員

on:
  schedule:
    - cron: "23 * * * *"
    # Additional morning-only checks at 06:10 / 06:25 / 06:40 / 06:55 Taipei.
    # Keep the hourly guard too. Active-run and freshness checks prevent
    # competing recovery writers; GitHub cron remains best-effort.
    - cron: "10,25,40,55 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system-guard.yml"
      - "briefing_watchdog.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: system-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install guard dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Check whether a fixed briefing needs recovery
        id: briefing_watchdog
        run: >-
          python briefing_watchdog.py
          --mode watchdog
          --github-output "$GITHUB_OUTPUT"
      - name: Dispatch one protected recovery run
        if: ${{ steps.briefing_watchdog.outputs.should_dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          active="$(gh run list --workflow stock-briefing.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "A briefing run is already active; recovery dispatch is not needed."
            exit 0
          fi
          gh workflow run stock-briefing.yml \
            -f period="${{ steps.briefing_watchdog.outputs.period }}" \
            -f recovery=true
      - name: Inspect report health
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python system_guard.py --state-change-only --notify-critical
      - name: Save status only when it changes
        shell: bash
        run: |
          git add reports/system_guard.json reports/stock_growth_control.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新 AI 系統值班狀態"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Guard status could not be published after 3 attempts." >&2
          exit 1
