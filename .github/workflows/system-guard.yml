name: AI 系統值班員

on:
  schedule:
    - cron: "23 * * * *"
    # Additional checks after all three fixed delivery times in Taipei.
    # Keep the hourly guard too. Active-run and freshness checks prevent
    # competing recovery writers; GitHub cron remains best-effort.
    - cron: "10,25,40,55 4,12,22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system-guard.yml"
      - "briefing_watchdog.py"
      - "agent_stock_recovery.py"
      - "agent_code_repair.py"
      - "system_guard.py"
      - "us_direction_agent.py"

permissions:
  contents: write
  actions: write
  pull-requests: write
  pages: write

concurrency:
  # Both workflows publish agent_runtime.json; serialize their writers.
  group: stock-agent-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # A rerun must observe persisted retry history, not its old event SHA.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install guard dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Inspect report health
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python system_guard.py --state-change-only --notify-critical
      - name: Diagnose and reserve bounded stock recovery
        env:
          GH_TOKEN: ${{ github.token }}
          WUDE_LIVE_API_BASE: https://wude-ai-stock-v6-production.up.railway.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python agent_stock_recovery.py
          python agent_code_repair.py
      - name: Publish reservation before any external action
        shell: bash
        run: |
          git add reports/agent_recovery.json reports/agent_code_repair.json reports/system_guard.json reports/stock_growth_control.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "記錄股票 Agent 修復預約與診斷"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Execute only the reserved protected recovery
        env:
          GH_TOKEN: ${{ github.token }}
          WUDE_LIVE_API_BASE: https://wude-ai-stock-v6-production.up.railway.app
        run: |
          python agent_stock_recovery.py --execute-reserved
          python agent_code_repair.py --execute
      - name: Verify and expose recovery evidence
        run: |
          python system_guard.py --state-change-only
          python agent_runtime.py --reports-dir reports
      - name: Save status only when it changes
        if: ${{ always() }}
        shell: bash
        run: |
          git add reports/system_guard.json reports/stock_growth_control.json reports/agent_recovery.json reports/agent_code_repair.json reports/agent_runtime.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新 AI 系統值班狀態"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Guard status could not be published after 3 attempts." >&2
          exit 1
