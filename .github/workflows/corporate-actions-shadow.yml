name: 股票公司事件影子監控

on:
  workflow_dispatch:
  schedule:
    # Daily 05:15 Asia/Taipei, before the 06:00 report.
    - cron: "15 21 * * *"
    # Sunday 02:00 Asia/Taipei full comparison checkpoint.
    - cron: "0 18 * * 6"

permissions:
  contents: write

concurrency:
  group: corporate-actions-shadow
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install HTTP dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Compare official security identities and status events
        id: corporate_actions
        continue-on-error: true
        run: python corporate_actions_shadow.py
      - name: Save shadow-only lifecycle records
        shell: bash
        run: |
          git add \
            reports/corporate_actions_shadow.json \
            reports/corporate_actions_shadow_history.json \
            reports/corporate_actions_registry.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新股票公司事件影子監控"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail only when every official identity registry failed
        if: ${{ steps.corporate_actions.outcome == 'failure' }}
        run: exit 1
