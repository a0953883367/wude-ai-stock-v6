name: Apply complete card patch
on:
  push:
    branches: [agent/complete-cards-patch-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-cards-patch-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/patch_complete_cards.py
      - run: pip install pytest
      - run: pytest -q tests/test_complete_card_contract.py tests/test_index_js_syntax.py
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'V6.29-S3 套用完整卡片安全修補'
          git push origin HEAD:agent/complete-cards-patch-v2
