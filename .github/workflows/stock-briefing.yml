name: AI 股票早中晚報

# Friend-safe publish enabled.
# Owner-only private publish verification.

on:
  schedule:
    # UTC schedule: Taiwan 06:00 / 12:00 / 20:00 reports plus a weekday
    # 17:00 Taiwan-close settlement.  The 17:00 run is silent and exists only
    # to settle Taiwan ledgers before the 20:00 evening notification.
    # Code pushes must not start a competing refresh or replace a close
    # checkpoint. A newly merged change takes effect at the next fixed report,
    # or can be verified with an explicit workflow_dispatch run.
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 9 * * 1-5"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: 報告時段
        required: true
        default: morning
        type: choice
        options:
          - morning
          - noon
          - evening

permissions:
  contents: write
  actions: write

concurrency:
  group: stock-briefing
  # Never let a later manual request cancel a running official settlement.
  # Keeping one shared group also prevents two report writers from racing.
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # The full 337-symbol universe can exceed 25 minutes when upstream market
    # or news providers respond slowly. Keep one atomic run instead of writing
    # a partial ranking snapshot.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore private Tiingo trial cache
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/tiingo_us_close_fallback.json
            reports/tiingo_us_close_staging.json
            reports/owner_private_holding_simulation.json
          key: tiingo-eod-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tiingo-eod-v1-
      - name: Restore private AI prediction database
        uses: actions/cache/restore@v4
        with:
          path: .prediction_engine/prediction_engine.sqlite3
          key: prediction-engine-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            prediction-engine-v1-
      - run: pip install -r requirements.txt
      - name: Select report period and delivery mode
        id: period
        shell: bash
        run: |
          commit_message=""
          no_telegram="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
            commit_message="更新 AI 股票${period}報"
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") period="morning"; commit_message="更新 AI 股票morning報" ;;
              "0 4 * * *") period="noon"; commit_message="更新 AI 股票noon報" ;;
              "0 9 * * 1-5")
                period="evening"
                no_telegram="true"
                commit_message="更新台股17:00收盤結算"
                ;;
              "0 12 * * *") period="evening"; commit_message="更新 AI 股票evening報" ;;
              *)
                echo "Unsupported schedule: ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi
          echo "value=$period" >> "$GITHUB_OUTPUT"
          echo "no_telegram=$no_telegram" >> "$GITHUB_OUTPUT"
          echo "commit_message=$commit_message" >> "$GITHUB_OUTPUT"
      - name: Generate report
        id: generate
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPACA_STOCK_FEED: ${{ vars.ALPACA_STOCK_FEED || 'sip' }}
          ALPACA_OPTION_FEED: ${{ vars.ALPACA_OPTION_FEED }}
        shell: bash
        run: |
          args=(--period "${{ steps.period.outputs.value }}")
          if [ "${{ steps.period.outputs.no_telegram }}" = "true" ]; then
            args+=(--no-telegram)
          fi
          python briefing.py "${args[@]}"
      - name: Publish sanitized friend-site data
        id: friend_publish
        continue-on-error: true
        env:
          FRIEND_SITE_URL: ${{ secrets.FRIEND_SITE_URL }}
          FRIEND_SITE_BYPASS_TOKEN: ${{ secrets.FRIEND_SITE_BYPASS_TOKEN }}
        run: python tools/publish_friend_data.py
      - name: Publish complete owner-site data
        id: owner_publish
        # The report is already complete at this point. A temporary owner-site
        # 5xx must not prevent the verified snapshot from being committed and
        # published through the normal report channel.
        continue-on-error: true
        env:
          OWNER_SITE_BYPASS_TOKEN: ${{ secrets.OWNER_SITE_BYPASS_TOKEN }}
        run: python tools/publish_owner_data.py
      - name: Run independent system guard
        if: ${{ always() && steps.generate.outcome == 'success' }}
        run: >-
          python system_guard.py
          --friend-publish "${{ steps.friend_publish.outcome }}"
          --owner-publish "${{ steps.owner_publish.outcome }}"
      - name: Save private Tiingo trial cache
        if: ${{ always() && steps.generate.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            reports/tiingo_us_close_fallback.json
            reports/tiingo_us_close_staging.json
            reports/owner_private_holding_simulation.json
          key: tiingo-eod-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save private AI prediction database
        if: >-
          ${{ always() && steps.generate.outcome == 'success' &&
          (github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '0 22 * * *' ||
          github.event.schedule == '0 9 * * 1-5') }}
        uses: actions/cache/save@v4
        with:
          path: .prediction_engine/prediction_engine.sqlite3
          key: prediction-engine-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep reports and recent archive
        if: ${{ steps.generate.outcome == 'success' }}
        shell: bash
        run: |
          find reports/archive -type f -name '*.json' -mtime +45 -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "${{ steps.period.outputs.commit_message }}"
          git push
