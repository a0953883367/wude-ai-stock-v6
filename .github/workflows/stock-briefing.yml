name: AI 股票早中晚報
run-name: ${{ inputs.validation_only && format('Agent permission probe {0}', inputs.validation_nonce) || 'AI 股票早中晚報' }}

# Friend-safe publish enabled.
# Owner-only private publish verification.

on:
  schedule:
    # UTC schedule: Taiwan 06:00 / 12:00 reports, a weekday 17:00 close
    # settlement, and a 19:30 evening preparation that is released at 20:00.
    # 17:00 Taiwan-close settlement.  The 17:00 run is silent and exists only
    # to settle Taiwan ledgers before the 20:00 evening notification.
    # Code pushes must not start a competing refresh or replace a close
    # checkpoint. A newly merged change takes effect at the next fixed report,
    # or can be verified with an explicit workflow_dispatch run.
    # Prepare fixed reports away from the top of the UTC hour, where GitHub
    # documents heavier schedule load. Verified delivery still occurs at the
    # official Taipei time below.
    # Morning has separate 05:35 / 05:45 / 05:55 Taipei triggers. The shared
    # concurrency group and freshness gate suppress completed duplicates;
    # every trigger still waits until 06:00 before verified delivery.
    - cron: "35 21 * * *"
    - cron: "45 21 * * *"
    - cron: "55 21 * * *"
    - cron: "35 3 * * *"
    - cron: "45 3 * * *"
    - cron: "55 3 * * *"
    - cron: "15 9 * * 1-5"
    - cron: "10 11 * * *"
    - cron: "30 11 * * *"
    - cron: "50 11 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: 報告時段
        required: true
        default: morning
        type: choice
        options:
          - morning
          - noon
          - evening
      recovery:
        description: 值班員補跑（套用固定時段、防重與逾時保護）
        required: false
        default: false
        type: boolean

      data_refresh:
        description: 靜默刷新目前資料（不補寄過期報、不建立送達紀錄）
        required: false
        default: false
        type: boolean

      source_validation_only:
        description: Validate existing daily sources only; no reports, delivery, publishing or commits
        required: false
        default: false
        type: boolean

      us_daily_history:
        description: Run bounded in-memory US daily history after a verified probe (no formal or raw exports)
        required: false
        default: false
        type: boolean

      tw_cohort_diagnostics:
        description: Inspect fixed TW pilot metadata only within source-validation mode; no ranking or raw exports
        required: false
        default: false
        type: boolean

      validation_only:
        description: 僅驗證 Agent 補跑權限與防重，不產報或寄送
        type: boolean
        default: false
      validation_nonce:
        description: 權限驗證識別碼
        type: string
        default: ""

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: stock-briefing
  # Never let a later manual request cancel a running official settlement.
  # Keeping one shared group also prevents two report writers from racing.
  cancel-in-progress: false

jobs:
  permission_validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest requests
      - name: Simulate duplicate, midnight and permission failures without sending
        run: python -m pytest -q tests/test_briefing_watchdog.py tests/test_agent_stock_recovery.py
  source_validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_validation_only == true && inputs.validation_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32,<3"
      - name: Validate fixed Fubon pilot with existing warmup and bounded probe
        timeout-minutes: 2
        env:
          WUDE_LIVE_API_BASE: https://wude-ai-stock-v6-production.up.railway.app
          TW_COHORT_DIAGNOSTICS: ${{ inputs.tw_cohort_diagnostics == true }}
        shell: bash
        run: |
          args=()
          if [ "$TW_COHORT_DIAGNOSTICS" = "true" ]; then
            args+=(--include-cohort-diagnostics)
          fi
          python tools/probe_fubon_daily_history.py "${args[@]}"
      - name: Validate existing bounded US daily source
        timeout-minutes: 3
        env:
          WUDE_LIVE_API_BASE: https://wude-ai-stock-v6-production.up.railway.app
          COLLECT_US_DAILY_HISTORY: ${{ inputs.us_daily_history == true }}
        shell: bash
        run: |
          args=()
          if [ "$COLLECT_US_DAILY_HISTORY" = "true" ]; then
            args+=(--collect-history)
          fi
          python tools/collect_us_daily_shadow_status.py "${args[@]}"
          # The collector writes an allowlisted operational projection only.
          cat reports/us_daily_shadow_status.json
  gate:
    if: ${{ inputs.source_validation_only != true }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Install silent direction gate dependency
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.data_refresh == true && inputs.validation_only != true }}
        run: python -m pip install "requests>=2.32,<3"
      - name: Prevent duplicate or expired fixed report
        id: check
        env:
          WUDE_LIVE_API_BASE: https://wude-ai-stock-v6-production.up.railway.app
        shell: bash
        run: |
          if [ "${{ inputs.validation_only }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Permission probe: all production report steps disabled."
            exit 0
          fi
          args=(--mode gate --schedule "${{ github.event.schedule }}" --github-output "$GITHUB_OUTPUT")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.data_refresh }}" = "true" ]; then
            args+=(--data-refresh --period "${{ inputs.period }}")
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.recovery }}" = "true" ]; then
            args+=(--recovery --period "${{ inputs.period }}")
          fi
          python briefing_watchdog.py "${args[@]}"

  briefing:
    needs: gate
    if: ${{ inputs.source_validation_only != true && needs.gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    # The full 337-symbol universe can exceed 25 minutes when upstream market
    # or news providers respond slowly. Keep one atomic run instead of writing
    # a partial ranking snapshot.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore private Tiingo trial cache
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/tiingo_us_close_fallback.json
            reports/tiingo_us_close_staging.json
            reports/owner_private_holding_simulation.json
          key: tiingo-eod-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tiingo-eod-v1-
      - name: Restore private AI prediction database
        uses: actions/cache/restore@v4
        with:
          path: .prediction_engine
          key: prediction-engine-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            prediction-engine-v1-
      - run: pip install -r requirements.txt "pytest>=8,<10"
      - name: Select report period and delivery mode
        id: period
        shell: bash
        run: |
          commit_message=""
          no_telegram="true"
          defer_delivery="false"
          delivery_target=""
          save_prediction="false"
          taiwan_hour="$(TZ=Asia/Taipei date +%H)"
          taiwan_weekday="$(TZ=Asia/Taipei date +%u)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
            save_prediction="true"
            commit_message="更新 AI 股票${period}報"
            if [ "${{ inputs.data_refresh }}" = "true" ]; then
              no_telegram="true"
              commit_message="靜默補跑目前股票資料"
            elif [ "${{ inputs.recovery }}" = "true" ]; then
              no_telegram="true"
              defer_delivery="true"
              case "$period" in
                morning) delivery_target="06:00" ;;
                noon) delivery_target="12:00" ;;
                evening) delivery_target="20:00" ;;
              esac
              commit_message="補跑 AI 股票${period}報"
            fi
          else
            case "${{ github.event.schedule }}" in
              "35 21 * * *" | "55 21 * * *" | "45 21 * * *")
                period="morning"
                no_telegram="true"
                defer_delivery="true"
                delivery_target="06:00"
                save_prediction="true"
                commit_message="更新 AI 股票morning報"
                ;;
              "35 3 * * *" | "45 3 * * *" | "55 3 * * *")
                # GitHub scheduled runs can be delayed for hours.  If the noon
                # run starts after Taiwan market close, use it as the missing
                # silent close settlement instead of publishing a stale noon
                # snapshot.  The normal 20:00 run can still send the evening
                # notification later.
                if [ "$taiwan_weekday" -le 5 ] && [ "$taiwan_hour" -ge 16 ]; then
                  period="evening"
                  no_telegram="true"
                  save_prediction="true"
                  commit_message="補跑延遲的台股收盤結算"
                else
                  period="noon"
                  no_telegram="true"
                  defer_delivery="true"
                  delivery_target="12:00"
                  commit_message="更新 AI 股票noon報"
                fi
                ;;
              "15 9 * * 1-5")
                period="evening"
                no_telegram="true"
                save_prediction="true"
                commit_message="更新台股17:00收盤結算"
                ;;
              "10 11 * * *" | "30 11 * * *" | "50 11 * * *")
                period="evening"
                no_telegram="true"
                defer_delivery="true"
                delivery_target="20:00"
                save_prediction="true"
                commit_message="更新 AI 股票evening報"
                ;;
              *)
                echo "Unsupported schedule: ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi
          echo "Taiwan actual time: weekday=$taiwan_weekday hour=$taiwan_hour; selected=$period; silent=$no_telegram"
          echo "value=$period" >> "$GITHUB_OUTPUT"
          echo "no_telegram=$no_telegram" >> "$GITHUB_OUTPUT"
          echo "save_prediction=$save_prediction" >> "$GITHUB_OUTPUT"
          echo "defer_delivery=$defer_delivery" >> "$GITHUB_OUTPUT"
          echo "delivery_target=$delivery_target" >> "$GITHUB_OUTPUT"
          echo "commit_message=$commit_message" >> "$GITHUB_OUTPUT"
      - name: Classify fixed-report delivery window
        id: delivery_window
        if: ${{ steps.period.outputs.defer_delivery == 'true' }}
        shell: bash
        run: |
          if python report_schedule.py \
            --target "${{ steps.period.outputs.delivery_target }}" \
            --mode check \
            --max-early-minutes 60 \
            --max-late-minutes 120
          then
            echo "timely=true" >> "$GITHUB_OUTPUT"
          else
            # A delayed fixed report must never be delivered as if it were
            # current. Publish freshly generated data independently;
            # delivery stays suppressed and no receipt is fabricated.
            echo "timely=false" >> "$GITHUB_OUTPUT"
            echo "Fixed delivery is stale; continuing as silent current-data settlement."
          fi
      - name: Generate report
        id: generate
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPACA_STOCK_FEED: ${{ vars.ALPACA_STOCK_FEED || 'sip' }}
          ALPACA_OPTION_FEED: ${{ vars.ALPACA_OPTION_FEED }}
          WUDE_LIVE_API_BASE: https://wude-ai-stock-v6-production.up.railway.app
        shell: bash
        run: |
          args=(--period "${{ steps.period.outputs.value }}")
          if [ "${{ steps.period.outputs.no_telegram }}" = "true" ]; then
            args+=(--no-telegram)
          fi
          python briefing.py "${args[@]}"
      - name: Record stock notification suppression
        run: echo "Stock Telegram delivery disabled; original ChatGPT tasks manage their own delivery."
      - name: Check private US same-source daily history in memory
        continue-on-error: true
        timeout-minutes: 3
        env:
          WUDE_LIVE_API_BASE: https://wude-ai-stock-v6-production.up.railway.app
          COLLECT_US_DAILY_HISTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.us_daily_history == true }}
        shell: bash
        run: |
          args=()
          if [ "$COLLECT_US_DAILY_HISTORY" = "true" ]; then
            args+=(--collect-history)
          fi
          python tools/collect_us_daily_shadow_status.py "${args[@]}"
      - name: Publish sanitized friend-site data
        id: friend_publish
        if: ${{ steps.generate.outcome == 'success' }}
        continue-on-error: true
        env:
          FRIEND_SITE_URL: ${{ secrets.FRIEND_SITE_URL }}
          FRIEND_SITE_BYPASS_TOKEN: ${{ secrets.FRIEND_SITE_BYPASS_TOKEN }}
        run: python tools/publish_friend_data.py
      - name: Publish complete owner-site data
        id: owner_publish
        # The report is already complete at this point. A temporary owner-site
        # 5xx must not prevent the verified snapshot from being committed and
        # published through the normal report channel.
        if: ${{ steps.generate.outcome == 'success' }}
        continue-on-error: true
        env:
          OWNER_SITE_BYPASS_TOKEN: ${{ secrets.OWNER_SITE_BYPASS_TOKEN }}
        run: python tools/publish_owner_data.py
      - name: Verify and compact historical archive storage
        if: ${{ always() && steps.generate.outcome == 'success' }}
        run: >-
          python tools/compact_history_archive.py
          --archive-dir reports/archive
          --reports-dir reports
          --health-file reports/history_archive_health.json
          --older-than-days 30
          --compress
          --remove-source-after-verify
      - name: Run independent system guard
        if: ${{ always() && steps.generate.outcome == 'success' }}
        run: >-
          python system_guard.py
          --friend-publish "${{ steps.friend_publish.outcome }}"
          --owner-publish "${{ steps.owner_publish.outcome }}"
      - name: Save private Tiingo trial cache
        if: ${{ always() && steps.generate.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            reports/tiingo_us_close_fallback.json
            reports/tiingo_us_close_staging.json
            reports/owner_private_holding_simulation.json
          key: tiingo-eod-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save private AI prediction database
        if: >-
          ${{ always() && steps.generate.outcome == 'success' &&
          steps.period.outputs.save_prediction == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .prediction_engine
          key: prediction-engine-v1-${{ github.run_id }}-${{ github.run_attempt }}
      # Warm only the two pilot symbols and probe before a report push can
      # redeploy Railway. The full optional collector remains after receipts.
      - name: Probe existing Fubon daily history for two pilot symbols
        if: ${{ steps.generate.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          WUDE_LIVE_API_BASE: https://wude-ai-stock-v6-production.up.railway.app
        run: python tools/probe_fubon_daily_history.py
      - name: Keep reports and recent archive
        if: ${{ steps.generate.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "${{ steps.period.outputs.commit_message }}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Report commit could not be published after 3 attempts." >&2
          exit 1
      - name: Safely advance prospective shadow registry from latest main
        if: ${{ steps.generate.outcome == 'success' }}
        timeout-minutes: 8
        run: python tools/publish_shadow_report_batch.py --max-attempts 3
      - name: Refresh read-only Fubon ownership supplement
        if: ${{ steps.generate.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          WUDE_LIVE_API_BASE: https://wude-ai-stock-v6-production.up.railway.app
        run: python fubon_ownership_deploy_gate.py
      - name: Publish optional ownership supplement
        if: ${{ steps.generate.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/fubon_ownership.json
          git diff --cached --quiet && exit 0
          git commit -m "更新唯讀盤後籌碼補充"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Report commit could not be published after 3 attempts." >&2
          exit 1
      - name: Confirm private settlement for stale fixed report
        if: >-
          ${{ steps.generate.outcome == 'success' &&
          steps.period.outputs.defer_delivery == 'true' &&
          steps.delivery_window.outputs.timely != 'true' }}
        run: >-
          echo "Stale report delivery suppressed; fresh public data and private evidence saved."


