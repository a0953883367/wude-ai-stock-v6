name: AI 股票早中晚報

on:
  schedule:
    # GitHub cron uses UTC. Taiwan: 06:00 / 12:00 / 20:00.
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: 報告時段
        required: true
        default: morning
        type: choice
        options:
          - morning
          - noon
          - evening

permissions:
  contents: write

concurrency:
  group: stock-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select report period
        id: period
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") period="morning" ;;
              "0 4 * * *") period="noon" ;;
              *) period="evening" ;;
            esac
          fi
          echo "value=$period" >> "$GITHUB_OUTPUT"
      - name: Generate and notify
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python briefing.py --period "${{ steps.period.outputs.value }}"
      - name: Keep the latest report and recent archive
        shell: bash
        run: |
          find reports/archive -type f -name '*.json' -mtime +45 -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.json reports/latest.md reports/archive
          git diff --cached --quiet && exit 0
          git commit -m "更新 AI 股票${{ steps.period.outputs.value }}報"
          git push
