name: AI 股票早中晚報

# Friend-safe publish enabled.
# Owner-only private publish verification.

on:
  # Rebuild the website once after scoring/data code is merged. Report-only
  # commits touch reports/** and therefore do not retrigger this workflow.
  push:
    branches:
      - main
    paths:
      - strategy.py
      - briefing.py
      - holding_simulation.py
      - exit_horizon_experiment.py
      - inverse_experiment.py
      - inverse_experiment_watchlist.json
      - missed_strength_validation.py
      - system_guard.py
      - million_simulation.py
      - weight_experiment.py
      - model_lab.py
      - performance.py
      - index.html
      - data_fetcher.py
      - macro_regime.py
      - market_models.py
      - news_risk.py
      - tw_official_data.py
      - us_market_data.py
      - notifier.py
      - tools/publish_friend_data.py
      - tools/publish_owner_data.py
      - watchlist.py
      - sitecustomize.py
      - .github/workflows/stock-briefing.yml
  schedule:
    # Fixed reports only. Run seven minutes after the target hour because
    # GitHub warns that schedules at the start of an hour can be delayed or
    # dropped during high load. Target windows remain Taiwan 06:00/12:00/20:00.
    - cron: "7 22 * * *" # 06:07 Asia/Taipei
    - cron: "7 4 * * *"  # 12:07 Asia/Taipei
    - cron: "7 12 * * *" # 20:07 Asia/Taipei
  workflow_dispatch:
    inputs:
      period:
        description: 報告時段
        required: true
        default: morning
        type: choice
        options:
          - morning
          - noon
          - evening

permissions:
  contents: write

concurrency:
  # Keep code-push refreshes isolated from scheduled reports. A code change
  # must never cancel the 06:00, 12:00, or 20:00 formal report.
  group: stock-briefing-${{ github.event_name }}-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # The full 337-symbol universe can exceed 25 minutes when upstream market
    # or news providers respond slowly. Keep one atomic run instead of writing
    # a partial ranking snapshot.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select report period and delivery mode
        id: period
        shell: bash
        run: |
          intraday="false"
          commit_message=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
            commit_message="更新 AI 股票${period}報"
          elif [[ "${{ github.event.head_commit.message }}" == *"[run-morning]"* ]]; then
            period="morning"
            commit_message="更新 AI 股票morning報"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # A code push may refresh the display, but it is not a scheduled
            # market-close checkpoint.  Keep all model ledgers and frozen
            # validation snapshots unchanged.
            period="evening"
            intraday="true"
            commit_message="程式更新後安全刷新"
          else
            case "${{ github.event.schedule }}" in
              "7 22 * * *") period="morning"; commit_message="更新 AI 股票morning報" ;;
              "7 4 * * *") period="noon"; commit_message="更新 AI 股票noon報" ;;
              "7 12 * * *") period="evening"; commit_message="更新 AI 股票evening報" ;;
              *)
                echo "Unsupported schedule: ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi
          echo "value=$period" >> "$GITHUB_OUTPUT"
          echo "intraday=$intraday" >> "$GITHUB_OUTPUT"
          echo "commit_message=$commit_message" >> "$GITHUB_OUTPUT"
      - name: Generate report
        id: generate
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_STOCK_FEED: ${{ vars.ALPACA_STOCK_FEED || 'sip' }}
          ALPACA_OPTION_FEED: ${{ vars.ALPACA_OPTION_FEED }}
        shell: bash
        run: |
          args=(--period "${{ steps.period.outputs.value }}")
          if [ "${{ steps.period.outputs.intraday }}" = "true" ]; then
            args+=(--no-telegram --intraday)
          fi
          python briefing.py "${args[@]}"
      - name: Publish sanitized friend-site data
        id: friend_publish
        continue-on-error: true
        env:
          FRIEND_SITE_URL: ${{ secrets.FRIEND_SITE_URL }}
          FRIEND_SITE_BYPASS_TOKEN: ${{ secrets.FRIEND_SITE_BYPASS_TOKEN }}
        run: python tools/publish_friend_data.py
      - name: Publish complete owner-site data
        id: owner_publish
        # The report is already complete at this point. A temporary owner-site
        # 5xx must not prevent the verified snapshot from being committed and
        # published through the normal report channel.
        continue-on-error: true
        env:
          OWNER_SITE_BYPASS_TOKEN: ${{ secrets.OWNER_SITE_BYPASS_TOKEN }}
        run: python tools/publish_owner_data.py
      - name: Run independent system guard
        if: ${{ always() && steps.generate.outcome == 'success' }}
        run: >-
          python system_guard.py
          --friend-publish "${{ steps.friend_publish.outcome }}"
          --owner-publish "${{ steps.owner_publish.outcome }}"
      - name: Keep reports and recent archive
        if: ${{ steps.generate.outcome == 'success' }}
        shell: bash
        run: |
          find reports/archive -type f -name '*.json' -mtime +45 -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "${{ steps.period.outputs.commit_message }}"
          git push
