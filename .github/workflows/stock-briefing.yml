name: AI 股票早中晚報

# Friend-safe publish enabled.
# Owner-only private publish verification.

on:
  # Rebuild the website once after scoring/data code is merged. Report-only
  # commits touch reports/** and therefore do not retrigger this workflow.
  push:
    branches:
      - main
    paths:
      - strategy.py
      - briefing.py
      - holding_simulation.py
      - exit_horizon_experiment.py
      - inverse_experiment.py
      - inverse_experiment_watchlist.json
      - missed_strength_validation.py
      - system_guard.py
      - million_simulation.py
      - weight_experiment.py
      - model_lab.py
      - performance.py
      - index.html
      - data_fetcher.py
      - macro_regime.py
      - market_models.py
      - news_risk.py
      - tw_official_data.py
      - us_market_data.py
      - notifier.py
      - watchlist.py
      - sitecustomize.py
      - .github/workflows/stock-briefing.yml
  schedule:
    # Fixed Telegram reports (UTC): Taiwan 06:00 / 12:00 / 20:00.
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"

    # Silent hourly refreshes during Taiwan trading hours.
    # 09:00 / 10:00 / 11:00 / 13:00 / 14:00 Asia/Taipei, weekdays.
    # The fixed 12:00 report above is the hourly noon refresh.
    - cron: "0 1 * * 1-5"
    - cron: "0 2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 6 * * 1-5"

    # Silent hourly refreshes covering US summer and winter trading hours.
    # 13:30 through 21:30 UTC, weekdays (21:30 through 05:30 Asia/Taipei).
    - cron: "30 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      period:
        description: 報告時段
        required: true
        default: morning
        type: choice
        options:
          - morning
          - noon
          - evening

permissions:
  contents: write

concurrency:
  group: stock-briefing
  # A newer scoring/data deployment supersedes a stale report generation.
  # Report files are committed only after a complete run, so cancellation
  # cannot publish a partial ranking snapshot.
  cancel-in-progress: true

jobs:
  briefing:
    runs-on: ubuntu-latest
    # The full 337-symbol universe can exceed 25 minutes when upstream market
    # or news providers respond slowly. Keep one atomic run instead of writing
    # a partial ranking snapshot.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select report period and delivery mode
        id: period
        shell: bash
        run: |
          intraday="false"
          commit_message=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
            commit_message="更新 AI 股票${period}報"
          elif [[ "${{ github.event.head_commit.message }}" == *"[run-morning]"* ]]; then
            period="morning"
            commit_message="更新 AI 股票morning報"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # A scoring/code deployment is a completed-report checkpoint, not
            # an intraday refresh.  Treating it as intraday used to preserve a
            # waiting placeholder and could overwrite the visible report.
            period="evening"
            commit_message="更新 AI 股票evening報"
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") period="morning"; commit_message="更新 AI 股票morning報" ;;
              "0 4 * * *") period="noon"; commit_message="更新 AI 股票noon報" ;;
              "0 12 * * *") period="evening"; commit_message="更新 AI 股票evening報" ;;
              "0 1 * * 1-5")
                period="noon"
                intraday="true"
                commit_message="靜默盤中更新 09:00"
                ;;
              "0 2 * * 1-5")
                period="noon"
                intraday="true"
                commit_message="靜默盤中更新 10:00"
                ;;
              "0 3 * * 1-5")
                period="noon"
                intraday="true"
                commit_message="靜默盤中更新 11:00"
                ;;
              "0 5 * * 1-5")
                period="noon"
                intraday="true"
                commit_message="靜默盤中更新 13:00"
                ;;
              "0 6 * * 1-5")
                period="noon"
                intraday="true"
                commit_message="靜默盤中更新 14:00"
                ;;
              *)
                period="evening"
                intraday="true"
                commit_message="靜默美股盤中更新"
                ;;
            esac
          fi
          echo "value=$period" >> "$GITHUB_OUTPUT"
          echo "intraday=$intraday" >> "$GITHUB_OUTPUT"
          echo "commit_message=$commit_message" >> "$GITHUB_OUTPUT"
      - name: Generate report
        id: generate
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_STOCK_FEED: ${{ vars.ALPACA_STOCK_FEED || 'sip' }}
          ALPACA_OPTION_FEED: ${{ vars.ALPACA_OPTION_FEED }}
        shell: bash
        run: |
          args=(--period "${{ steps.period.outputs.value }}")
          if [ "${{ steps.period.outputs.intraday }}" = "true" ]; then
            args+=(--no-telegram --intraday)
          fi
          python briefing.py "${args[@]}"
      - name: Publish sanitized friend-site data
        id: friend_publish
        continue-on-error: true
        env:
          FRIEND_SITE_URL: ${{ secrets.FRIEND_SITE_URL }}
          FRIEND_SITE_BYPASS_TOKEN: ${{ secrets.FRIEND_SITE_BYPASS_TOKEN }}
        run: python tools/publish_friend_data.py
      - name: Publish complete owner-site data
        id: owner_publish
        # The report is already complete at this point. A temporary owner-site
        # 5xx must not prevent the verified snapshot from being committed and
        # published through the normal report channel.
        continue-on-error: true
        env:
          OWNER_SITE_BYPASS_TOKEN: ${{ secrets.OWNER_SITE_BYPASS_TOKEN }}
        run: python tools/publish_owner_data.py
      - name: Run independent system guard
        if: ${{ always() && steps.generate.outcome == 'success' }}
        run: >-
          python system_guard.py
          --friend-publish "${{ steps.friend_publish.outcome }}"
          --owner-publish "${{ steps.owner_publish.outcome }}"
      - name: Keep reports and recent archive
        if: ${{ steps.generate.outcome == 'success' }}
        shell: bash
        run: |
          find reports/archive -type f -name '*.json' -mtime +45 -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "${{ steps.period.outputs.commit_message }}"
          git push
