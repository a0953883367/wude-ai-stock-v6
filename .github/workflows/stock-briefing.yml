name: AI 股票早中晚報

on:
  schedule:
    # Fixed Telegram reports (UTC): Taiwan 06:00 / 12:00 / 20:00.
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"

    # Silent background refreshes during Taiwan trading hours.
    # 09:00-13:30 Asia/Taipei, weekdays; 12:00 is covered by the fixed report.
    - cron: "0,30 1-3 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "0,30 5 * * 1-5"

    # Silent background refreshes covering regular US trading hours.
    # The wider UTC window safely covers both daylight-saving and standard time.
    - cron: "30 13 * * 1-5"
    - cron: "0,30 14-20 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
    inputs:
      period:
        description: 報告時段
        required: true
        default: morning
        type: choice
        options:
          - morning
          - noon
          - evening

permissions:
  contents: write

concurrency:
  group: stock-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select report period and delivery mode
        id: period
        shell: bash
        run: |
          intraday="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") period="morning" ;;
              "0 4 * * *") period="noon" ;;
              "0 12 * * *") period="evening" ;;
              "0,30 1-3 * * 1-5"|"30 4 * * 1-5"|"0,30 5 * * 1-5")
                period="noon"
                intraday="true"
                ;;
              *)
                period="evening"
                intraday="true"
                ;;
            esac
          fi
          echo "value=$period" >> "$GITHUB_OUTPUT"
          echo "intraday=$intraday" >> "$GITHUB_OUTPUT"
      - name: Generate report
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          args=(--period "${{ steps.period.outputs.value }}")
          if [ "${{ steps.period.outputs.intraday }}" = "true" ]; then
            args+=(--no-telegram --intraday)
          fi
          python briefing.py "${args[@]}"
      - name: Keep reports and recent archive
        shell: bash
        run: |
          find reports/archive -type f -name '*.json' -mtime +45 -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "更新 AI 股票${{ steps.period.outputs.value }}報"
          git push
