name: 影子交易計畫更新

on:
  push:
    branches: [main]
    paths:
      - "trade_plan_shadow.py"
      - "reports/decision_hub.json"
      - "reports/decision_hub_*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-plan-shadow
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安裝測試工具
        run: python -m pip install "pytest>=8,<10"
      - name: 建立影子交易計畫
        run: python trade_plan_shadow.py --reports-dir reports
      - name: 驗證交易計畫
        run: python -m pytest -q tests/test_trade_plan_shadow.py
      - name: 保存最新計畫
        run: |
          if git diff --quiet -- reports/trade_plan_shadow.json reports/trade_plan_shadow_health.json; then
            echo "交易計畫沒有變更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trade_plan_shadow.json reports/trade_plan_shadow_health.json
          git commit -m "chore: 更新影子交易計畫"
          git pull --rebase origin main
          git push origin HEAD:main
