name: 影子交易計畫更新

on:
  push:
    branches: [main]
    paths:
      - "decision_hub.py"
      - "shadow_stock_conclusion.py"
      - "point_in_time_events.py"
      - "tw_daily_shadow_attestation.py"
      - "tw_prospective_registry.py"
      - "tw_prospective_runtime.py"
      - "tw_price_action_coverage.py"
      - "tools/publish_shadow_report_batch.py"
      - "trade_plan_shadow.py"
      - "trade_plan_validation.py"
      - ".github/workflows/trade-plan-shadow.yml"
      - "reports/decision_hub.json"
      - "reports/decision_hub_*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-plan-shadow
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安裝測試工具
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: 從最新完整批次重建並安全保存影子計畫
        run: python tools/publish_shadow_report_batch.py --max-attempts 3
