name: Apply ALL stock search patch

on:
  push:
    branches:
      - agent/all-stock-analysis
    paths:
      - tools/patch_all_search.py
      - .github/workflows/apply-all-search.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/all-stock-analysis
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_all_search.py
      - name: Validate ALL search contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          required=["function buildAllAnalysisPool()","if(q==='ALL')","ALL 全部股票分析","輸入 ALL、NVDA","V6.29-ALL1"]
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit('missing: '+repr(missing))
          print('ALL search contract OK')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add ALL stock analysis search"
          git push origin HEAD:agent/all-stock-analysis
