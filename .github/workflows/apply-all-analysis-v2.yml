name: Apply ALL analysis v2

on:
  push:
    branches:
      - agent/all-analysis-v2
    paths:
      - tools/patch_all_analysis_v2.py
      - .github/workflows/apply-all-analysis-v2.yml
      - tests/test_data_fetcher.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/all-analysis-v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Apply patch
        run: python tools/patch_all_analysis_v2.py
      - name: Compile
        run: python -m py_compile data_fetcher.py briefing.py
      - name: Run tests
        run: python -m pytest tests -q
      - name: Validate ALL v2 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from data_fetcher import load_search_universe
          payload=json.loads(Path('search_data.json').read_text(encoding='utf-8'))
          rows=load_search_universe()
          assert len(rows)==payload['total'], (len(rows),payload['total'])
          html=Path('index.html').read_text(encoding='utf-8')
          brief=Path('briefing.py').read_text(encoding='utf-8')
          required=["reports/all_analysis.json","STATE.allAnalysis","完整分析","V6.29-ALL2"]
          for token in required:
              if token not in html and token not in brief:
                  raise SystemExit('missing '+token)
          assert 'all_analysis_payload' in brief
          print('ALL analysis v2 contract OK; candidates=',len(rows))
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_fetcher.py briefing.py index.html tests/test_full_universe.py
          git diff --cached --quiet && exit 0
          git commit -m "Analyze full search universe for ALL"
          git push origin HEAD:agent/all-analysis-v2
