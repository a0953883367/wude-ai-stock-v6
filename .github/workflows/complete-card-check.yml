name: Complete card check
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/test_complete_card_contract.py'
      - 'tests/test_index_js_syntax.py'
      - '.github/workflows/complete-card-check.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pytest
      - run: pytest -q tests/test_complete_card_contract.py tests/test_index_js_syntax.py
