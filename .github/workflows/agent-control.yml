name: 中央 Agent 安全控制層

on:
  workflow_dispatch:
  schedule:
    # 台灣每日 08:20、12:20、20:35，在既有報表後實際巡檢；不呼叫付費模型。
    - cron: "20 0,4 * * *"
    - cron: "35 12 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-control.yml"
      - "agent_control.py"
      - "agent_runtime.py"
      - "dynamic_capability_loader.py"
      - "agent_workspaces/capability_catalog.json"
      - "agent_workspaces/wt_fasteners/**"
      - "agent_workspaces/packaging_startup/**"
      - "reports/model_learning.json"
      - "reports/validation_60d.json"
      - "reports/weekly_shadow_coach.json"
      - "reports/system_guard.json"

permissions:
  contents: write

concurrency:
  # Both workflows publish agent_runtime.json; serialize their writers.
  group: stock-agent-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安裝測試工具
        run: python -m pip install pytest requests
      - name: 自動讀取已授權的 Agent 輸入來源
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: python tools/google_drive_agent_inputs.py
      - name: 建立控制層狀態
        run: |
          python agent_control.py --reports-dir reports
          python agent_runtime.py --reports-dir reports
          python agent_tasks.py --root . --reports-dir reports
      - name: 驗證安全規則
        run: python -m pytest -q tests/test_agent_control.py tests/test_agent_runtime.py tests/test_agent_tasks.py && node tests/test_agent_control_ui.js
      - name: 保存最新狀態
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- reports/agent_control.json reports/agent_runtime.json reports/agent_tasks.json reports/agent_input_connectors.json; then
            echo "控制層狀態沒有變更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agent_control.json reports/agent_runtime.json reports/agent_tasks.json reports/agent_input_connectors.json
          git commit -m "chore: 更新中央 Agent 控制狀態"
          git pull --rebase origin main
          git push origin HEAD:main
