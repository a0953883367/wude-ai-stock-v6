<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>武得股票・即時資金流</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--card:#111f33;--line:#29415f;--text:#f8fafc;--muted:#94a3b8;--cyan:#38bdf8;--green:#5ee6a8;--red:#fb7185;--gold:#f8c862;--purple:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#091827);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.shell{max-width:820px;margin:auto;padding:16px 16px 110px}.hero,.panel{background:rgba(13,27,45,.96);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.eyebrow{margin:0 0 6px;color:var(--cyan);font-size:13px;font-weight:850}.hero h1,.panel h2,.panel h3{margin:0}.hero p,.muted,.note{color:var(--muted);line-height:1.6}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.button,.hero a,.tabs button{appearance:none;border:1px solid #3d5d84;background:#13243a;color:var(--text);border-radius:999px;padding:10px 13px;font-weight:800;text-decoration:none}.button.enabled,.tabs button.active{background:#155e75;border-color:#38bdf8}.button:disabled{opacity:.55}.status-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:#cbd5e1;font-size:12px}.streams,.summary,.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stream,.metric,.list-card{background:#0a1828;border:1px solid #27415f;border-radius:16px;padding:13px}.stream.connected{border-color:#1e8f68}.stream.blocked{border-color:#a16207}.stream span,.metric span,.row small{display:block;color:var(--muted);font-size:12px}.stream b,.metric b{display:block;margin-top:6px;font-size:17px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{cursor:pointer;padding:8px 12px}.metric b.positive,.positive{color:var(--green)}.metric b.negative,.negative{color:var(--red)}.list-card h3{font-size:16px;margin-bottom:7px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1f3550}.row:last-child{border-bottom:0}.row b{font-size:14px}.row>span{text-align:right;font-weight:900}.alerts{display:grid;gap:10px}.alert{background:#0a1828;border-left:6px solid var(--gold);border-radius:14px;padding:13px}.alert.sell{border-left-color:var(--red)}.alert-title{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.market{background:#6d43b5;border-radius:999px;padding:4px 8px;font-size:12px}.alert em{color:var(--gold);font-style:normal;font-weight:900}.alert.sell em{color:var(--red)}.alert-meta{display:flex;gap:11px;flex-wrap:wrap;color:#cbd5e1;margin-top:8px;font-size:13px}.error{background:#3a191f;border:1px solid #be3454;color:#fecdd3;border-radius:14px;padding:13px;line-height:1.6;margin-top:12px}.empty{padding:18px;color:var(--muted);text-align:center}.dock{position:fixed;left:16px;right:16px;bottom:14px;max-width:788px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(7,17,31,.94);border:1px solid #31577d;border-radius:20px;padding:9px;backdrop-filter:blur(16px);z-index:5}.dock a{color:white;text-decoration:none;text-align:center;font-weight:850;padding:10px 4px;font-size:13px}.dock a.active{color:var(--gold)}
@media(max-width:620px){.hero{display:block}.hero-actions{justify-content:flex-start;margin-top:12px}.streams,.summary,.lists{grid-template-columns:1fr}.shell{padding:10px 10px 104px}.panel,.hero{border-radius:18px;padding:15px}}
</style>
</head>
<body>
<main class="shell">
  <header class="hero">
    <div><p class="eyebrow">本人專用・直接連接即時後端</p><h1>🚨 大量買賣／資金流</h1><p>台股與美股分開統計；畫面每10秒同步，背景時停止讀取。</p></div>
    <div class="hero-actions"><button class="button" id="soundButton" type="button">開啟聲音</button><button class="button" id="refreshButton" type="button">立即更新</button></div>
  </header>

  <section class="panel">
    <p class="eyebrow">全市場監控狀態</p>
    <div class="streams" id="streams"><div class="stream"><span>台股・富邦</span><b>等待連線</b></div><div class="stream"><span>美股・Alpaca SIP</span><b>等待連線</b></div></div>
    <div class="status-line"><span class="badge" id="syncStatus">正在準備資料…</span><span class="badge">不讀取個別股票即時股價</span><span class="badge">不修改排名・不下單</span></div>
    <div id="errorBox"></div>
  </section>

  <section class="panel">
    <p class="eyebrow">獨立影子統計・買進與賣出都計算</p><h2>🌊 推估資金流向</h2>
    <div class="tabs" id="marketTabs"><button class="active" data-market="TW">🇹🇼 台股</button><button data-market="US">🇺🇸 美股</button></div>
    <div class="tabs" id="windowTabs"><button data-window="1m">1分鐘</button><button data-window="5m">5分鐘</button><button class="active" data-window="15m">15分鐘</button><button data-window="60m">60分鐘</button></div>
    <div class="summary" id="flowSummary"></div>
    <div class="lists" id="flowLists"></div>
    <p class="note">依逐筆成交價相對委買賣與 tick rule 推估，無法識別真實帳戶、外資或主力身分。ETF、集合競價及特殊成交會分開或排除。</p>
  </section>

  <section class="panel"><p class="eyebrow">最近50筆</p><h2>↕️ 大量主動買賣</h2><div class="alerts" id="alerts"><div class="empty">符合門檻的大買或大賣訊號會顯示在這裡。</div></div></section>
</main>

</html>
