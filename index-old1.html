<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>武得 AI 股票助理 V6</title>
<style>
:root{--bg:#08111f;--card:#111c2e;--line:#263750;--text:#f5f7fb;--muted:#9eabc0;--green:#35d07f;--blue:#2c4f83;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;background:#08111f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.wrap{max-width:920px;margin:auto;padding:24px 16px 48px}
h1{font-size:30px;margin:0 0 8px}.sub{color:var(--muted);font-size:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:18px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tab{border:0;background:var(--blue);color:#fff;padding:15px 8px;border-radius:14px;font-size:17px;font-weight:800}
.search{display:flex;gap:10px;margin-top:14px}.search input{flex:1;min-width:0;background:#0b1626;border:1px solid #38506f;color:#fff;border-radius:14px;padding:15px;font-size:18px}.go{border:0;background:#69d28d;color:#0b3b20;border-radius:14px;padding:0 18px;font-size:17px;font-weight:900}
.status{color:var(--muted);margin:5px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.stock{background:#0b1626;border:1px solid var(--line);border-radius:16px;padding:15px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.name{font-weight:900;font-size:20px}.code{color:var(--muted);font-size:13px}.score{color:var(--green);font-weight:900;font-size:18px}
.price{font-size:28px;font-weight:900;margin:10px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#14243b;color:#dce6f7;font-size:12px;margin:2px 4px 2px 0}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.metric{background:#101e32;border-radius:11px;padding:9px;font-size:12px;color:var(--muted)}.metric b{display:block;color:#fff;margin-top:3px;font-size:14px}
.buy{margin-top:12px;background:#10261e;border:1px solid #24553d;border-radius:12px;padding:11px;line-height:1.65}.buy b{color:#70e5a5}
.action{margin-top:12px;font-size:17px;font-weight:900;color:var(--gold)}
.note{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:680px){.grid{grid-template-columns:1fr}.tabs{gap:8px}.tab{font-size:15px}.search input{font-size:16px}.go{font-size:15px;padding:0 14px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>武得 AI 股票助理 V6</h1>
  <div class="sub">台股＋美股 AI 選股系統｜手機一鍵版</div>

  <div class="panel">
    <div class="tabs">
      <button class="tab" onclick="showMode('tw')">台股 TOP10</button>
      <button class="tab" onclick="showMode('us')">美股 TOP10</button>
      <button class="tab" onclick="showMode('single')">單股查詢</button>
    </div>
    <div class="search">
      <input id="query" placeholder="輸入 NVDA、AMZN、2330.TW">
      <button class="go" onclick="searchStock()">開始分析</button>
    </div>
  </div>

  <div class="panel">
    <h2 id="title">台股 TOP10</h2>
    <div id="status" class="status">正在讀取 stock_data.json...</div>
    <div id="cards" class="grid"></div>
    <div class="note">資料直接讀取 Colab 產生的 stock_data.json；合理買入、較佳買點、積極買入、支撐壓力、AI 分數、新聞判斷與操作建議皆依資料檔顯示。</div>
  </div>
</div>

<script>
let DATA = {tw:[], us:[]};
let mode = "tw";
const V = (obj, key, fallback="—") => (obj && obj[key] !== undefined && obj[key] !== null && obj[key] !== "") ? obj[key] : fallback;

function normalize(s){
  return {
    name: V(s,"股票"),
    symbol: V(s,"代號"),
    market: V(s,"市場"),
    theme: V(s,"主題"),
    risk: V(s,"風險分類"),
    price: V(s,"現價"),
    ai: V(s,"AI總分"),
    tech: V(s,"技術分數"),
    funda: V(s,"基本面分數"),
    value: V(s,"估值分數"),
    newsScore: V(s,"新聞分數"),
    news: V(s,"新聞判斷"),
    earnings: V(s,"下次財報"),
    days: V(s,"距財報天數"),
    earningsRisk: V(s,"財報風險"),
    rsi: V(s,"RSI"),
    m3: V(s,"3月基準%"),
    m6: V(s,"6月基準%"),
    y1: V(s,"1年基準%"),
    bull: V(s,"1年樂觀%"),
    bear: V(s,"1年悲觀%"),
    upProb: V(s,"上漲機率%"),
    vol: V(s,"年化波動%"),
    fairLow: V(s,"合理買入低"),
    fairHigh: V(s,"合理買入高"),
    betterLow: V(s,"較佳買點低"),
    betterHigh: V(s,"較佳買點高"),
    aggressive: V(s,"積極買入價"),
    support1: V(s,"第一支撐"),
    support2: V(s,"第二支撐"),
    resist1: V(s,"第一壓力"),
    resist2: V(s,"第二壓力"),
    riskPrice: V(s,"風控價"),
    final: V(s,"FINAL 操作"),
    chg20: V(s,"20日漲幅%"),
    chg60: V(s,"60日漲幅%"),
    high52: V(s,"距52週高點%"),
    heat: V(s,"過熱狀態"),
    heatReason: V(s,"過熱原因"),
    timing: V(s,"買進時機分數"),
    revised: V(s,"修正後操作")
  }
}

function stockCard(raw){
  const s = normalize(raw);
  return `<div class="stock">
    <div class="top">
      <div><div class="name">${s.name}</div><div class="code">${s.symbol}｜${s.market}</div></div>
      <div class="score">AI ${s.ai}</div>
    </div>
    <div class="price">${s.price}</div>
    <div>
      <span class="pill">${s.theme}</span>
      <span class="pill">風險：${s.risk}</span>
      <span class="pill">RSI ${s.rsi}</span>
    </div>
    <div class="metrics">
      <div class="metric">技術分數<b>${s.tech}</b></div>
      <div class="metric">基本面分數<b>${s.funda}</b></div>
      <div class="metric">估值分數<b>${s.value}</b></div>
      <div class="metric">新聞分數<b>${s.newsScore}</b></div>
      <div class="metric">3月基準<b>${s.m3}%</b></div>
      <div class="metric">6月基準<b>${s.m6}%</b></div>
      <div class="metric">1年基準<b>${s.y1}%</b></div>
      <div class="metric">上漲機率<b>${s.upProb}%</b></div>
    </div>
    <div class="buy">
      合理買入：<b>${s.fairLow} ～ ${s.fairHigh}</b><br>
      較佳買點：<b>${s.betterLow} ～ ${s.betterHigh}</b><br>
      積極買入：<b>${s.aggressive}</b><br>
      第一／二支撐：<b>${s.support1} / ${s.support2}</b><br>
      第一／二壓力：<b>${s.resist1} / ${s.resist2}</b><br>
      風控價：<b>${s.riskPrice}</b>
    </div>
    <div class="metrics">
      <div class="metric">下次財報<b>${s.earnings}</b></div>
      <div class="metric">財報風險<b>${s.earningsRisk}</b></div>
      <div class="metric">20日漲幅<b>${s.chg20}%</b></div>
      <div class="metric">60日漲幅<b>${s.chg60}%</b></div>
    </div>
    <div class="note">新聞：${s.news}<br>過熱：${s.heat}｜${s.heatReason}</div>
    <div class="action">${s.revised !== "—" ? s.revised : s.final}</div>
  </div>`;
}

function render(list){
  document.getElementById("cards").innerHTML = list.length ? list.slice(0,10).map(stockCard).join("") : '<div class="status">找不到資料。</div>';
}

function showMode(m){
  mode = m;
  if(m === "tw"){ document.getElementById("title").textContent = "台股 TOP10"; render(DATA.tw); }
  else if(m === "us"){ document.getElementById("title").textContent = "美股 TOP10"; render(DATA.us); }
  else { document.getElementById("title").textContent = "單股查詢"; render([]); }
}

function searchStock(){
  const q = document.getElementById("query").value.trim().toUpperCase();
  if(!q) return;
  const all = [...DATA.tw, ...DATA.us];
  const hit = all.filter(x => String(V(x,"代號","")).toUpperCase() === q || String(V(x,"股票","")).toUpperCase().includes(q));
  mode = "single";
  document.getElementById("title").textContent = `單股查詢：${q}`;
  render(hit);
}

fetch("stock_data.json?ts=" + Date.now(), {cache:"no-store"})
  .then(r => {
    if(!r.ok) throw new Error("stock_data.json not found");
    return r.json();
  })
  .then(d => {
    DATA.tw = Array.isArray(d.tw_top10) ? d.tw_top10 : [];
    DATA.us = Array.isArray(d.us_top10) ? d.us_top10 : [];
    document.getElementById("status").textContent = `${V(d,"system","武得 AI 股票助理")}｜${V(d,"version","")}｜台股 ${DATA.tw.length} 檔｜美股 ${DATA.us.length} 檔`;
    showMode("tw");
  })
  .catch(err => {
    document.getElementById("status").textContent = "讀取 stock_data.json 失敗，請確認檔案與 index.html 在同一層。";
    render([]);
  });
</script>
</body>
</html>
