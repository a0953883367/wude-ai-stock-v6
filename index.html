<script>

var STATE={stockData:null,allLegacy:[],normalized:[],tw:[],us:[],etf:[],quantum:null,optical:null,latest:null,reports:{},view:'TW'};

function esc(value){return String(value===undefined||value===null?'—':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
function first(obj,names,fallback){for(var i=0;i<names.length;i++){var v=obj[names[i]];if(v!==undefined&&v!==null&&v!=='')return v;}return fallback===undefined?'—':fallback;}
function hasValue(value){return value!==undefined&&value!==null&&value!==''&&value!=='—';}
function number(value,digits){if(!hasValue(value))return '—';var n=Number(value);return Number.isFinite(n)?n.toLocaleString('zh-TW',{minimumFractionDigits:digits||0,maximumFractionDigits:digits===undefined?2:digits}):'—';}
function percent(value){if(!hasValue(value))return '—';var n=Number(value);return Number.isFinite(n)?(n>=0?'+':'')+n.toFixed(2)+'%':'—';}
function priceValue(value){if(!hasValue(value))return '—';var n=Number(value);return Number.isFinite(n)?number(n,2):esc(value);}
function compact(value){if(!hasValue(value))return '—';var n=Number(value);if(!Number.isFinite(n))return '—';if(Math.abs(n)>=100000000)return (n/100000000).toFixed(2)+'億';if(Math.abs(n)>=10000)return (n/10000).toFixed(2)+'萬';return number(n,0);}
function compactSigned(value){if(!hasValue(value))return '—';var n=Number(value);if(!Number.isFinite(n))return '—';return (n>0?'+':'')+compact(n);}
function range(obj,a,b){var low=first(obj,[a],'—'),high=first(obj,[b],'—');if(low==='—'&&high==='—')return '—';if(high==='—'||String(low)===String(high))return low;return low+' ～ '+high;}
function lightFrom(text,score){text=String(text||'');if(text.indexOf('🟢')>=0)return '🟢';if(text.indexOf('🔴')>=0)return '🔴';if(text.indexOf('🟡')>=0)return '🟡';var n=Number(score);return n>=70?'🟢':n>=58?'🟡':'🔴';}
function marketCode(symbol,market){symbol=String(symbol||'');return market==='TW'?symbol.split('.')[0]:symbol;}
function sortByScore(rows){return rows.slice().sort(function(a,b){var x=Number(a.score),y=Number(b.score);if(!Number.isFinite(x))x=-Infinity;if(!Number.isFinite(y))y=-Infinity;return y-x;});}

function bounded(value){var n=Number(value);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):50;}
function radarSvg(values){
  var cx=85,cy=85,r=58,angles=[-90,-30,30,90,150,210];
  function point(angle,ratio){var rad=angle*Math.PI/180;return (cx+Math.cos(rad)*r*ratio).toFixed(1)+','+(cy+Math.sin(rad)*r*ratio).toFixed(1);}
  var grids=[.25,.5,.75,1].map(function(level){return '<polygon points="'+angles.map(function(a){return point(a,level);}).join(' ')+'" fill="none" stroke="#334155" stroke-width="1"/>';}).join('');
  var axes=angles.map(function(a){return '<line x1="'+cx+'" y1="'+cy+'" x2="'+point(a,1).split(',')[0]+'" y2="'+point(a,1).split(',')[1]+'" stroke="#26364d"/>';}).join('');
  var shape=angles.map(function(a,i){return point(a,bounded(values[i])/100);}).join(' ');
  return '<svg class="radar" viewBox="0 0 170 170" role="img" aria-label="六大分析雷達圖">'+grids+axes+'<polygon points="'+shape+'" fill="rgba(56,189,248,.30)" stroke="#38bdf8" stroke-width="2"/><circle cx="85" cy="85" r="3" fill="#4ade80"/><text x="85" y="13" text-anchor="middle">技術</text><text x="151" y="49" text-anchor="middle">量能</text><text x="151" y="127" text-anchor="middle">籌碼</text><text x="85" y="164" text-anchor="middle">財務</text><text x="19" y="127" text-anchor="middle">成長</text><text x="19" y="49" text-anchor="middle">估值</text></svg>';
}
function scoreTone(value){var n=bounded(value);return n>=70?'強':n>=58?'偏強':n>=45?'中性':'偏弱';}
function insightRows(stock){
  var rows=[],price=Number(stock.price),ma20=Number(stock.ma20),rsi=Number(stock.rsi),vol=Number(stock.volume),inst=Number(stock.institution5d),per=Number(stock.per),growth=Number(stock.revenueYoy),debt=Number(stock.debtRatio);
  if(Number.isFinite(price)&&Number.isFinite(ma20))rows.push([price>=ma20?'good':'warn','技術｜現價'+(price>=ma20?'站上':'跌破')+'20日線 '+number(ma20,2)]);
  if(Number.isFinite(rsi))rows.push([rsi>=78?'warn':rsi<35?'warn':'good','動能｜RSI '+number(rsi,1)+(rsi>=78?'，短線偏熱':rsi<35?'，弱勢區需等止穩':'，尚未進入極端區')]);
  if(Number.isFinite(vol))rows.push([vol>=1.5?'good':vol<.7?'warn':'info','量能｜相對量 '+number(vol,2)+'x'+(vol>=1.5?'，市場參與度提高':vol<.7?'，量能不足':'，量能一般')]);
  if(Number(stock.institutionAvailable)>0&&Number.isFinite(inst))rows.push([inst>0?'good':inst<0?'warn':'info','籌碼｜法人近5日 '+compactSigned(inst)+(inst>0?'，偏向買超':'，偏向賣超')]);
  if(Number(stock.fundamentalAvailable)>0&&Number.isFinite(per)&&per>0)rows.push([per<=30?'good':'warn','估值｜PER '+number(per,2)+(per<=20?'，相對不高':per<=30?'，位於中間區':'，需留意估值偏高')]);
  if(Number(stock.fundamentalAvailable)>0&&Number.isFinite(growth))rows.push([growth>0?'good':'warn','成長｜月營收年增 '+percent(growth)+(growth>0?'，營運維持成長':'，營收動能轉弱')]);
  if(Number(stock.financialQualityAvailable)>0){rows.push([Number(stock.operatingCashFlowPositive)>0?'good':'bad','財務｜營業現金流為'+(Number(stock.operatingCashFlowPositive)>0?'正':'負')+(Number.isFinite(debt)?'，負債比 '+percent(debt):'')]);}
  return rows;
}
function analysisPanel(stock){
  var chip=(bounded(stock.institutionScore)*.75+bounded(stock.creditScore)*.25),values=[bounded(stock.technical),bounded(stock.volumeScore),chip,bounded(stock.financialQualityScore),bounded(stock.growthScore),bounded(stock.valuationScore)];
  var factors=[
    ['技術',values[0],'均線、RSI、K線與支撐壓力'],['量能',values[1],'相對量能、攻擊量與量價結構'],['籌碼',values[2],'法人為主，融資融券為輔'],
    ['財務',values[3],'EPS、獲利率、ROE、負債與現金流'],['成長',values[4],'月營收年增與月增趨勢'],['估值',values[5],'PER、PBR與殖利率']
  ];
  var missing=[];if(!Number(stock.institutionAvailable))missing.push('籌碼');if(!Number(stock.fundamentalAvailable))missing.push('估值／成長');if(!Number(stock.financialQualityAvailable))missing.push('財務');
  var ordered=factors.slice().sort(function(a,b){return b[1]-a[1];}),insights=insightRows(stock),coverage=6-missing.length;
  var conclusion='<div class="deep-conclusion"><b>AI 重點：</b>目前最強為「'+ordered[0][0]+'」'+number(ordered[0][1],1)+'分；較弱為「'+ordered[ordered.length-1][0]+'」'+number(ordered[ordered.length-1][1],1)+'分。<br><span class="coverage">可靠資料涵蓋 '+coverage+'/6 面向；此處只解讀現有分數，不另行改變排名。</span></div>';
  var insightHtml=insights.length?'<div class="insight-title">逐項判斷原因</div>'+insights.map(function(x){return '<div class="insight '+x[0]+'">'+esc(x[1])+'</div>';}).join(''):'';
  return '<details class="deep"><summary>🧠 查看六大深入分析</summary><div class="deep-body">'+conclusion+'<div class="radar-wrap">'+radarSvg(values)+'<div>'+factors.map(function(f){return '<div class="factor"><div class="factor-head"><b>'+f[0]+'</b><span>'+number(f[1],1)+'｜'+scoreTone(f[1])+'</span></div><div class="factor-track"><div class="factor-fill" style="width:'+bounded(f[1])+'%"></div></div><div class="factor-note">'+f[2]+'</div></div>';}).join('')+'</div></div>'+insightHtml+(missing.length?'<div class="neutral-note">⚠️ '+missing.join('、')+'尚未取得完整資料，目前以中性 50 分呈現，不會因此扣分。</div>':'')+'</div></details>';
}

function renderStocks(stocks){
  var box=document.getElementById('results');
  if(!stocks||!stocks.length){box.innerHTML='<div class="empty">目前沒有可顯示的股票資料。</div>';return;}
  box.innerHTML=stocks.map(stockCard).join('');
}
function setActive(selector,attribute,value){document.querySelectorAll(selector).forEach(function(btn){btn.classList.toggle('active',btn.getAttribute(attribute)===value);});}
function clearOtherNav(active){
  ['#marketButtons button','#quantumButtons button','#opticalButtons button','#shortButtons button','#longButtons button','#reportButtons button'].forEach(function(selector){
    if(selector!==active)document.querySelectorAll(selector).forEach(function(b){b.classList.remove('active');});
  });
}


function showMidLong(group){
  STATE.view='LONG:'+group;
  setActive('#longButtons button','data-long',group);
  clearOtherNav('#longButtons button');
  var rows=STATE.normalized.filter(function(stock){
    if(group==='ETF')return String(stock.type||'').toUpperCase()==='ETF';
    return stock.market===group&&String(stock.type||'').toUpperCase()!=='ETF';
  }).sort(function(a,b){
    var eligibleDiff=Number(Boolean(b.midLongEligible))-Number(Boolean(a.midLongEligible));
    if(eligibleDiff!==0)return eligibleDiff;
    return Number(b.midLongScore||0)-Number(a.midLongScore||0);
  }).slice(0,20);
  var titles={TW:'🇹🇼 台股中長線布局',US:'🇺🇸 美股中長線布局',ETF:'📊 ETF中長線布局'};
  document.getElementById('title').textContent=titles[group];
  document.getElementById('status').textContent='合格且資料完整者優先，再依中長線分數由高到低；不合格者仍保留顯示但移至後方。持有規劃3～12個月，採三批資金布局。';
  renderStocks(rows);
}

function showQuantum(group){
  STATE.view='QUANTUM:'+group;setActive('#quantumButtons button','data-quantum',group);clearOtherNav('#quantumButtons button');
  var cfg=STATE.quantum&&STATE.quantum.groups?STATE.quantum.groups[group]:null;
  if(!cfg){document.getElementById('title').textContent='⚛️ 量子概念股';document.getElementById('status').textContent='量子清單尚未載入';renderStocks([]);return;}
  var pool=STATE.normalized.concat(STATE.allLegacy.map(normalizeLegacy));
  var seen={};
  pool=pool.filter(function(row){
    var key=quantumSymbol(row.symbol);
    if(!key||seen[key])return false;
    seen[key]=true;return true;
  });
  var matched=[],missing=[];
  (cfg.items||[]).forEach(function(item){
    var key=quantumSymbol(item.symbol);
    var stock=pool.find(function(row){return quantumSymbol(row.symbol)===key;});
    if(stock){
      var copy=Object.assign({},stock);
      copy.risk=(item.classification||'量子概念')+'｜'+(item.role||copy.risk||'');
      matched.push({stock:copy,item:item});
    }else missing.push(item);
  });
  matched.sort(function(a,b){
    var x=Number(a.stock.entryScore),y=Number(b.stock.entryScore);
    if(!Number.isFinite(x))x=Number(a.stock.score);
    if(!Number.isFinite(y))y=Number(b.stock.score);
    if(!Number.isFinite(x))x=-Infinity;
    if(!Number.isFinite(y))y=-Infinity;
    return y-x;
  });
  document.getElementById('title').textContent=cfg.title;
  document.getElementById('status').textContent='固定清單全部顯示｜已有分數者由高到低；缺少行情者標示「資料待補」｜'+(cfg.note||'量子概念觀察清單');
  var notice='<div class="empty">⚛️ '+esc(STATE.quantum.disclaimer||'量子產業仍在早期，波動與技術路線風險高。')+'</div>';
  var cards=matched.map(function(entry,index){return stockCard(entry.stock,index);}).join('');
  var placeholders=missing.map(function(item,index){return quantumPlaceholder(item,matched.length+index);}).join('');
  document.getElementById('results').innerHTML=notice+cards+placeholders;
}

}
function showOptical(group){
  STATE.view='OPTICAL:'+group;setActive('#opticalButtons button','data-optical',group);clearOtherNav('#opticalButtons button');
  var cfg=STATE.optical&&STATE.optical.groups?STATE.optical.groups[group]:null;
  if(!cfg){document.getElementById('title').textContent='🔦 光通訊概念股';document.getElementById('status').textContent='光通訊清單尚未載入';renderStocks([]);return;}
  var pool=STATE.normalized.concat(STATE.allLegacy.map(normalizeLegacy));
  var seen={};
  pool=pool.filter(function(row){var key=quantumSymbol(row.symbol);if(!key||seen[key])return false;seen[key]=true;return true;});
  var matched=[],missing=[];
  (cfg.items||[]).forEach(function(item){
    var key=quantumSymbol(item.symbol);
    var stock=pool.find(function(row){return quantumSymbol(row.symbol)===key;});
    if(stock){
      var copy=Object.assign({},stock);
      copy.risk=(item.classification||'光通訊概念')+'｜'+(item.role||copy.risk||'');
      matched.push({stock:copy,item:item});
    }else missing.push(item);
  });
  matched.sort(function(a,b){
    var x=Number(a.stock.entryScore),y=Number(b.stock.entryScore);
    if(!Number.isFinite(x))x=Number(a.stock.score);
    if(!Number.isFinite(y))y=Number(b.stock.score);
    if(!Number.isFinite(x))x=-Infinity;if(!Number.isFinite(y))y=-Infinity;
    return y-x;
  });
  document.getElementById('title').textContent=cfg.title;
  document.getElementById('status').textContent='固定清單全部顯示｜已有分數者由高到低；缺少行情者標示「資料待補」｜'+(cfg.note||'光通訊概念觀察清單');
  var notice='<div class="empty">🔦 '+esc(STATE.optical.disclaimer||'光通訊產業受AI資料中心需求與庫存循環影響。')+'</div>';
  var cards=matched.map(function(entry,index){return stockCard(entry.stock,index);}).join('');
  var placeholders=missing.map(function(item,index){return opticalPlaceholder(item,matched.length+index);}).join('');
  document.getElementById('results').innerHTML=notice+cards+placeholders;
}
function showMarket(view){
  STATE.view=view;setActive('#marketButtons button','data-view',view);clearOtherNav('#marketButtons button');
  var map={TW:['🇹🇼 台股 最值得買 TOP20',STATE.tw],US:['🇺🇸 美股 最值得買 TOP20',STATE.us],ETF:['📊 ETF 最值得買 TOP20',STATE.etf]};
  if(view==='WATCH'){
    document.getElementById('title').textContent='⭐ 我的固定觀察清單';
    var rows=STATE.latest&&STATE.latest.watchlist?sortByScore(STATE.latest.watchlist.map(normalizeReport)):[];
    document.getElementById('status').textContent=STATE.latest?'最新更新：'+STATE.latest.updated_at+'｜固定清單 '+rows.length+' 檔':'等待第一份自動報告';
    renderStocks(rows);return;
  }
  document.getElementById('title').textContent=map[view][0];
  document.getElementById('status').textContent='✅ '+(STATE.stockData&&STATE.stockData.version?STATE.stockData.version:'V6')+'｜自動讀取最新排行';
  renderStocks(map[view][1]);
}
function renderMarketStrip(report){
  var box=document.getElementById('marketStrip');if(!report||!report.market){box.innerHTML='';return;}
  box.innerHTML=Object.keys(report.market).map(function(name){var item=report.market[name]||{},chg=Number(item.change_pct);return '<div class="market-pill"><span>'+esc(name)+'</span><b class="'+(chg>=0?'up':'down')+'">'+esc(number(item.price,2))+' '+esc(percent(chg))+'</b></div>';}).join('');
}
function renderPerformance(report){
  var box=document.getElementById('performanceStrip'),p=report&&report.performance,h=p&&p.horizons;
  if(!h){box.innerHTML='<div class="performance">🎯 回測已啟動，累積資料後顯示命中率。</div>';return;}
  var available=['1','5','10','20'].filter(function(k){return Number((h[k]||{}).samples)>0;});
  if(!available.length){box.innerHTML='<div class="performance">🎯 已開始保存每次 TOP20；累積1個交易日後顯示第一批結果。</div>';return;}
  var c=p.calibration||{},guard=c.status==='ready_for_review'?'🔔 已滿16個交易日，等待確認後才納入計分':'🛡️ 保護期尚差 '+number(c.remaining_trading_days,0)+' 個交易日；目前不影響AI分數';
  box.innerHTML='<div class="performance">🎯 歷史回測（僅代表過往）<br>'+available.map(function(k){var m=h[k];return '<b>'+k+'日</b>：'+m.samples+'筆｜命中 '+number(m.win_rate_pct,1)+'%｜平均 '+percent(m.avg_return_pct)+'｜最差 '+percent(m.worst_return_pct);}).join('<br>')+'<br>'+guard+'</div>';
}
async function fetchJSON(path){var response=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);return response.json();}
async function showReport(period){
  setActive('#reportButtons button','data-period',period);document.querySelectorAll('#marketButtons button').forEach(function(b){b.classList.remove('active');});
  var names={morning:'🌅 AI 股票早報',noon:'☀️ AI 股票午報',evening:'🌙 AI 股票晚報'};
  document.getElementById('title').textContent=names[period];document.getElementById('status').textContent='正在讀取報告…';
  try{
    var report=STATE.reports[period]||await fetchJSON('reports/'+period+'.json');STATE.reports[period]=report;
    var statusText='更新：'+report.updated_at+'｜固定清單 '+report.watchlist_analyzed_count+'/'+report.watchlist_count+' 檔｜背景掃描 '+report.universe_count+' 檔';
    var ds=report.data_status||{};
    if(ds.finmind_configured===false)statusText+='｜⚠️ FinMind Token 未設定';
    else if(ds.finmind_configured&&(Number(ds.institutional_count)===0||Number(ds.credit_count)===0||Number(ds.fundamental_count)===0))statusText+='｜⚠️ 籌碼／基本面資料未完整取得';
    if(ds.finmind_configured&&Number(ds.broker_count)===0)statusText+='｜ℹ️ 分點無權限或未取得';
    if(ds.finmind_configured&&Number(ds.financial_quality_count)<Number(ds.expected_tw_count))statusText+='｜財務品質 '+Number(ds.financial_quality_count||0)+'/'+Number(ds.expected_tw_count||0)+' 檔（分批補齊）';
    document.getElementById('status').textContent=statusText;
    renderMarketStrip(report);
    renderPerformance(report);
    var tw=sortByScore(report.watchlist.filter(function(x){return x.market==='TW';}).map(normalizeReport));
    var us=sortByScore(report.watchlist.filter(function(x){return x.market==='US';}).map(normalizeReport));
    var html='<div class="group">🇹🇼 台股固定觀察</div>'+tw.map(stockCard).join('')+'<div class="group">🇺🇸 美股與 ETF 固定觀察</div>'+us.map(stockCard).join('');
    if(report.unavailable&&report.unavailable.length){html+='<div class="group">⚪ 暫無可靠行情</div><div class="empty">'+report.unavailable.map(function(x){return esc(x.name)+'('+esc(marketCode(x.symbol,x.market))+')';}).join('、')+'</div>';}
    html+='<div class="group">🏆 全台股背景掃描最強 5 檔</div>'+sortByScore(report.top.map(normalizeReport)).map(stockCard).join('');
    document.getElementById('results').innerHTML=html;
  }catch(error){
    if(STATE.latest&&STATE.latest.period===period){STATE.reports[period]=STATE.latest;return showReport(period);}
    document.getElementById('status').textContent='此時段報告尚未產生';
    document.getElementById('results').innerHTML='<div class="empty">等待下一次 '+names[period]+' 自動更新後，這裡就會顯示完整內容。</div>';
  }
}
function searchStock(){
  var q=document.getElementById('ticker').value.trim().toUpperCase();if(!q)return;
  var pool=STATE.allLegacy.map(normalizeLegacy);
  if(STATE.latest&&STATE.latest.watchlist){pool=pool.concat(STATE.latest.watchlist.map(normalizeReport));}
  var seen={},found=pool.filter(function(s){var key=String(s.symbol).toUpperCase();if(seen[key])return false;var hit=key===q||key===q+'.TW'||key===q+'.TWO'||String(s.name).toUpperCase().indexOf(q)>=0;if(hit)seen[key]=true;return hit;});
  document.getElementById('title').textContent='🔍 單股查詢：'+q;document.getElementById('status').textContent=found.length?'找到 '+found.length+' 檔':'找不到符合資料';renderStocks(found);
}
async function loadAll(){
  try{
    var pair=await Promise.all([
      fetchJSON('reports/rankings.json').catch(function(){return null;}),
      fetchJSON('stock_data.json'),
      fetchJSON('reports/latest.json').catch(function(){return null;}),
      fetchJSON('quantum_watchlist.json').catch(function(){return null;}),
      fetchJSON('optical_watchlist.json').catch(function(){return null;})
    ]);
    var live=pair[0],raw=pair[1],all=Array.isArray(raw)?raw:(Array.isArray(raw.data)?raw.data:[]);
    STATE.stockData=raw;STATE.allLegacy=all;STATE.latest=pair[2];STATE.quantum=pair[3];STATE.optical=pair[4];if(STATE.latest)STATE.reports[STATE.latest.period]=STATE.latest;
    var legacy=all.map(normalizeLegacy);
    var current=live&&Array.isArray(live.data)?live.data.map(normalizeReport):[];
    var normalized=current.length?current:legacy;
    STATE.normalized=normalized;
    STATE.tw=sortByScore(normalized.filter(function(x){return x.market==='TW'&&String(x.type).toUpperCase().indexOf('ETF')<0;})).slice(0,20);
    STATE.us=sortByScore(normalized.filter(function(x){return x.market==='US'&&String(x.type).toUpperCase().indexOf('ETF')<0;})).slice(0,20);
    STATE.etf=sortByScore(normalized.filter(function(x){return String(x.type).toUpperCase().indexOf('ETF')>=0;})).slice(0,20);
    renderMarketStrip(STATE.latest);renderPerformance(STATE.latest);showMarket('TW');
    if(live&&live.updated_at)document.getElementById('status').textContent+='｜排名更新 '+live.updated_at;
  }catch(error){document.getElementById('status').textContent='❌ 資料讀取失敗';document.getElementById('results').innerHTML='<div class="error">無法讀取股票資料：'+esc(error.message)+'</div>';}
}
document.querySelectorAll('#marketButtons button').forEach(function(btn){btn.addEventListener('click',function(){showMarket(btn.getAttribute('data-view'));});});
document.querySelectorAll('#quantumButtons button').forEach(function(btn){btn.addEventListener('click',function(){showQuantum(btn.getAttribute('data-quantum'));});});
document.querySelectorAll('#opticalButtons button').forEach(function(btn){btn.addEventListener('click',function(){showOptical(btn.getAttribute('data-optical'));});});
document.querySelectorAll('#longButtons button').forEach(function(btn){btn.addEventListener('click',function(){showMidLong(btn.getAttribute('data-long'));});});
document.querySelectorAll('#shortButtons button').forEach(function(btn){btn.addEventListener('click',function(){showShortTerm(btn.getAttribute('data-short'));});});
document.querySelectorAll('#reportButtons button').forEach(function(btn){btn.addEventListener('click',function(){showReport(btn.getAttribute('data-period'));});});
document.getElementById('refreshButton').addEventListener('click',function(){
  var button=this;
  button.disabled=true;
  button.textContent='⏳ 正在讀取最新資料…';
  window.location.reload();
});
document.getElementById('searchButton').addEventListener('click',searchStock);
document.getElementById('ticker').addEventListener('keydown',function(e){if(e.key==='Enter')searchStock();});
loadAll();
</script>
