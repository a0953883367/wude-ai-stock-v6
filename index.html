function getValue(stock,names){

    for(const name of names){

        if(
            stock[name] !== undefined &&
            stock[name] !== null &&
            stock[name] !== ""
        ){

            return stock[name];

        }

    }

    return "—";
}


function rangeValue(stock,lowName,highName){

    const low = getValue(stock,[lowName]);

    const high = getValue(stock,[highName]);

    if(low === "—" && high === "—"){
        return "—";
    }

    if(low === high){
        return low;
    }

    return low + " ～ " + high;
}

async function loadData(){

    const status =
        document.getElementById("status");


    try{

        const response =
            await fetch(
                "stock_data.json?t=" + Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const rawData =
            await response.json();

        const allStocks =
            Array.isArray(rawData)
                ? rawData
                : (
                    Array.isArray(rawData.data)
                        ? rawData.data
                        : []
                  );

        const twStocks =
            allStocks
            .filter(x =>
                String(x["市場"] || "")
                .includes("台")
            )
            .sort(
                (a,b) =>
                    Number(b["AI總分"] || 0)
                    -
                    Number(a["AI總分"] || 0)
            );

        const usStocks =
            allStocks
            .filter(x =>
                String(x["市場"] || "")
                .includes("美")
            )
            .sort(
                (a,b) =>
                    Number(b["AI總分"] || 0)
                    -
                    Number(a["AI總分"] || 0)
            );

        DATA = {
            version:
                rawData.version
                || "V6.14-K17",

            all:
                allStocks,

            tw_top10:
                twStocks.slice(0,10),

            us_top10:
                usStocks.slice(0,10),

            tw_all:
                twStocks,

            us_all:
                usStocks
        };

        // V614_K16_JSON_NORMALIZE
        DATA = Array.isArray(DATA)
            ? DATA
            : (
                Array.isArray(DATA?.data)
                    ? DATA.data
                    : []
              );

        console.log(
            "V6.14-K16 股票資料筆數:",
            DATA.length
        );



        status.innerText =

            "✅ " +

            (DATA.version || "V6") +

            "｜台股 " +

            (DATA.tw_top10 || []).length +

            " 檔｜美股 " +

            (DATA.us_top10 || []).length +

            " 檔";


        showMarket("TW");

    }


    catch(error){

        console.error(error);


        status.innerText =
            "❌ stock_data.json 讀取失敗";


        document
        .getElementById("results")
        .innerHTML =
        `
        <div class="error">

        stock_data.json 無法讀取。

        <br><br>

        錯誤：
        ${error.message}

        </div>
        `;

    }

}

function v614GetInput(){

    const inputs = Array.from(
        document.querySelectorAll("input")
    );

    let input = inputs.find(
        el => {

            const p = (
                el.placeholder || ""
            ).toLowerCase();

            return (
                p.includes("nvda") ||
                p.includes("2330") ||
                p.includes("amzn")
            );

        }
    );

    if(!input){

        input = inputs.find(
            el =>
                el.type === "text" ||
                !el.type
        );

    }

    return input || null;
}

    box = document.createElement("div");

/* ---------------------------------------------------------
   執行搜尋
--------------------------------------------------------- */

function v614RunSearch(){

    const input = v614GetInput();

    if(!input){
        return false;
    }

    const originalQuery =
        input.value.trim();

    const q =
        originalQuery.toLowerCase();

    if(!q){
        return false;
    }


    if(!V614_SEARCH_READY){

        const box = v614GetResultBox();

        box.innerHTML = `
        <div style="
            background:#3a2d12;
            border-radius:18px;
            padding:18px;
            color:#ffd66b;
        ">
            ⏳ 搜尋資料載入中，
            請稍後再按一次搜尋。
        </div>
        `;

        return true;
    }


    const words = v614Words(q);


    let found = V614_SEARCH_DATA.filter(
        item => {

            const text = [

                item["股票"],
                item["代號"],
                item["市場"],
                item["類型"],
                item["主題"],
                item["次產業"]

            ]
            .join(" ")
            .toLowerCase();

            return words.some(
                word =>
                    text.includes(
                        String(word)
                        .toLowerCase()
                    )
            );

        }
    );


    /* 去除重複代號 */

    const seen = new Set();

    found = found.filter(item => {

        const ticker =
            String(
                item["代號"] || ""
            );

        if(seen.has(ticker)){
            return false;
        }

        seen.add(ticker);

        return true;
    });


    /* 完全符合名稱 / 代號優先 */

    found.sort((a,b) => {

        function priority(x){

            const ticker =
                String(
                    x["代號"] || ""
                ).toLowerCase();

            const name =
                String(
                    x["股票"] || ""
                ).toLowerCase();


            if(ticker === q){
                return 0;
            }

            if(
                ticker.replace(".tw","")
                .replace(".two","")
                === q
            ){
                return 1;
            }

            if(name === q){
                return 2;
            }

            if(
                ticker.includes(q)
            ){
                return 3;
            }

            if(
                name.includes(q)
            ){
                return 4;
            }

            return 5;
        }

        return (
            priority(a)
            -
            priority(b)
        );

    });


    const box = v614GetResultBox();


    if(found.length === 0){

        box.innerHTML = `

        <div style="
            background:#3b171c;
            color:#ffadb4;
            border-radius:20px;
            padding:22px;
            margin-top:18px;
        ">

            ⚠️ 搜尋資料庫目前找不到：

            <b>
                ${v614Esc(originalQuery)}
            </b>

        </div>

        `;

        return true;
    }


    /* 最多顯示60筆 */

    found = found.slice(
        0,
        60
    );


    const tw = found.filter(
        item =>
            String(
                item["市場"] || ""
            ).includes("台")
    );


    const us = found.filter(
        item =>
            String(
                item["市場"] || ""
            ).includes("美")
    );


    box.innerHTML = `

        <div style="
            font-size:27px;
            font-weight:900;
            margin-top:25px;
            margin-bottom:8px;
            color:#ffffff;
        ">
            🔎 搜尋：
            ${v614Esc(originalQuery)}
        </div>


        <div style="
            color:#aab4c8;
            margin-bottom:22px;
        ">
            共找到
            ${found.length}
            筆相關標的
        </div>


        ${
            tw.length
            ? `

            <div style="
                font-size:23px;
                font-weight:900;
                margin-top:20px;
            ">
                🇹🇼 台灣
                ${tw.length}
                筆
            </div>

            ${v614Cards(tw)}

            `
            : ""
        }


        ${
            us.length
            ? `

            <div style="
                font-size:23px;
                font-weight:900;
                margin-top:28px;
            ">
                🇺🇸 美國
                ${us.length}
                筆
            </div>

            ${v614Cards(us)}

            `
            : ""
        }

    `;


    box.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });


    return true;
}


/* ---------------------------------------------------------
   攔截 Enter
--------------------------------------------------------- */

document.addEventListener(
    "keydown",
    function(event){

        const input =
            v614GetInput();

        if(
            input &&
            event.target === input &&
            event.key === "Enter"
        ){

            event.preventDefault();

            event.stopImmediatePropagation();

            v614RunSearch();

        }

    },
    true
);


/* ---------------------------------------------------------
   攔截搜尋按鈕
--------------------------------------------------------- */

document.addEventListener(
    "click",
    function(event){

        const input =
            v614GetInput();

        if(!input){
            return;
        }


        const button =
            event.target.closest("button");

        if(!button){
            return;
        }


        const searchPanel =
            input.closest(".search")
            ||
            input.parentElement;


        const insideSameArea =
            searchPanel &&
            searchPanel.contains(button);


        const buttonText =
            (
                button.innerText ||
                button.textContent ||
                ""
            );


        const looksLikeSearch =
            insideSameArea
            ||
            buttonText.includes("🔍")
            ||
            buttonText.includes("搜尋")
            ||
            buttonText.includes("分析");


        if(looksLikeSearch){

            if(
                input.value.trim()
            ){

                event.preventDefault();

                event.stopImmediatePropagation();

                v614RunSearch();

            }

        }

    },
    true
);
