<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>武得 AI 股票助理 V6</title>
<style>
body{margin:0;background:#08111f;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:900px;margin:auto;padding:20px 16px}.card{background:#111c2e;border:1px solid #263750;border-radius:18px;padding:16px;margin:15px 0}h1{font-size:28px;margin-bottom:6px}.sub,.muted{color:#9eabc0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs button,.go{padding:13px;border:0;border-radius:12px;font-weight:700}.tabs button{background:#17375e;color:white}.search{display:flex;gap:8px;margin-top:12px}.search input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #31435e;background:#081321;color:white;font-size:16px}.go{background:#35d07f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stock{background:#0b1626;border:1px solid #263750;border-radius:15px;padding:14px}.stock h3{margin:0}.score{color:#35d07f}.buy{margin-top:10px;background:#10261e;padding:10px;border-radius:10px}.buy b{color:#70e5a5}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="w">
<h1>武得 AI 股票助理 V6</h1><div class="sub">台股＋美股 AI 選股系統｜手機一鍵版</div>
<div class="card"><div class="tabs"><button onclick="show('tw')">台股 TOP10</button><button onclick="show('us')">美股 TOP10</button><button onclick="single()">單股查詢</button></div>
<div class="search"><input id="q" placeholder="輸入 NVDA、2330.TW"><button class="go" onclick="single()">開始分析</button></div></div>
<div class="card"><h2 id="title">台股 TOP10</h2><div id="status" class="muted">讀取 stock_data.json...</div><div id="list" class="grid"></div>
<p class="muted">V6 買入價不寫死，資料端可依最新股價、均線、支撐壓力、估值、新聞與 AI 共識每日重算。</p></div>
</div><script>
let D={tw:[],us:[]};
const val=(x)=>x===undefined||x===null||x===""?"—":x;
function card(s){return `<div class="stock"><h3>${val(s.symbol||s.ticker)} <span class="score">｜V6 ${val(s.score)}</span></h3><h2>${val(s.price)}</h2><div>上漲機率：${val(s.up_probability)}%</div><p>3月：${val(s.forecast_3m)}<br>6月：${val(s.forecast_6m)}<br>12月：${val(s.forecast_12m)}</p><div class="buy">合理買入價：<b>${val(s.fair_buy)}</b><br>較佳買點：<b>${val(s.better_buy)}</b><br>積極買入：<b>${val(s.aggressive_buy)}</b><br>支撐／壓力：<b>${val(s.support)} / ${val(s.resistance)}</b></div><p>基本面：${val(s.fundamental)}<br>估值：${val(s.valuation)}<br>新聞情緒：${val(s.news_sentiment)}<br>財報日期：${val(s.earnings_date)}</p><b>${val(s.advice,"等待 AI 建議")}</b></div>`}
function render(a){document.getElementById("list").innerHTML=a.length?a.slice(0,10).map(card).join(""):'<p class="muted">尚無股票資料；下一步上傳 stock_data.json。</p>'}
function show(m){document.getElementById("title").textContent=m==="tw"?"台股 TOP10":"美股 TOP10";render(D[m]||[])}
function single(){let q=document.getElementById("q").value.trim().toUpperCase();let a=[...D.tw,...D.us].filter(s=>String(s.symbol||s.ticker||"").toUpperCase()===q);document.getElementById("title").textContent="單股查詢："+q;render(a)}
fetch("stock_data.json?"+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{D.tw=d.tw||d.taiwan||[];D.us=d.us||d.usa||[];document.getElementById("status").textContent="資料更新："+val(d.updated_at);show("tw")}).catch(()=>{document.getElementById("status").textContent="首頁已完成；下一步加入 stock_data.json";render([])})
</script></body></html>
